<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever 地图编辑器</title>
<style>
:root { --bg:#1d1f23; --panel:#262a30; --line:#3a3f48; --text:#d8dce2; --dim:#8b93a0; --accent:#4c9ffe; --warn:#e8a33c; --bad:#e5534b; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
#top { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
#top .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
button, select, input { font:inherit; color:var(--text); background:#30353d; border:1px solid var(--line); border-radius:4px; padding:3px 8px; }
button { cursor:pointer; } button:hover { border-color:var(--accent); } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
button:disabled { opacity:.4; cursor:default; }
input[type=number] { width:70px; } input[type=text] { width:150px; } input[type=range] { padding:0; }
#main { display:flex; height:calc(100% - 41px - 22px); }
#left { width:250px; overflow:auto; padding:8px; background:var(--panel); border-right:1px solid var(--line); }
#right { width:280px; overflow:auto; padding:8px; background:var(--panel); border-left:1px solid var(--line); }
#center { flex:1; position:relative; min-width:0; }
#c2d, #c3d { position:absolute; inset:0; width:100%; height:100%; display:block; }
#c3dWrap { position:absolute; inset:0; display:none; }
#status { height:22px; padding:2px 8px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); white-space:nowrap; overflow:hidden; }
h4 { margin:10px 0 4px; color:var(--dim); font-weight:600; font-size:12px; letter-spacing:.05em; }
.row { display:flex; align-items:center; gap:6px; margin:4px 0; } .row > label { width:64px; color:var(--dim); flex:none; } .row > * { min-width:0; } .row > input[type=checkbox] { flex:none; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; } .tabs button { flex:1; }
.chips { display:flex; flex-wrap:wrap; gap:4px; } .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 6px; border:1px solid var(--line); border-radius:10px; cursor:pointer; } .chip.on { border-color:var(--accent); } .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
.warn { color:var(--warn); margin:3px 0; } .hint { color:var(--dim); margin:4px 0; }
.msg { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#000c; padding:6px 12px; border-radius:6px; pointer-events:none; display:none; z-index:3; }
</style>
</head>
<body>
<div id="top"></div>
<div id="main">
	<div id="left"></div>
	<div id="center">
		<canvas id="c2d"></canvas>
		<div id="c3dWrap"><canvas id="c3d"></canvas></div>
		<div class="msg" id="msg"></div>
	</div>
	<div id="right"></div>
</div>
<div id="status"></div>
<input type="file" id="fileInput" style="display:none">

<script src="vendor/three.min.js"></script>
<script src="js/terrain.js"></script>
<script src="js/io.js"></script>
<script src="js/roadnet.js"></script>
<script src="js/lots.js"></script>
<script src="js/greens.js"></script>
<script>
'use strict';
// Forever 地图编辑器：地形/路网/地块，导出 .terrain / .roadnet。操作见 README.md，文件格式见 Source/Basic/map/*.md。
const ME = window.ME;

// ======================= 状态 =======================
const S = {
	terrain: new ME.Terrain(1024, 1024),
	model: ME.newModel(1024, 1024),
	view: { scale: 3, ox: 20, oy: 20 },
	mode3d: false,
	tool: 'terrain',            // terrain / road / lot / green
	greenMode: 'draw',          // 绿化工具的子模式：draw=画多边形 / link=连接道路(先点绿化的边，再点路)
	// 地形笔刷
	// 每种笔刷各存一份参数(半径/强度/目标高度/水位/限定地形...)，切换笔刷不会互相覆盖。S.brush 是当前笔刷的那一份。
	brushOp: 'paint',
	brushes: {
		paint: { op: 'paint', radius: 6, terrain: 'terrain_mountain' },
		water: { op: 'water', radius: 6, level: ME.SEA_LEVEL, erase: false },
		raise: { op: 'raise', radius: 6, strength: 0.5, lockTerrain: false, allowFlat: true },
		lower: { op: 'lower', radius: 6, strength: 0.5, lockTerrain: false, allowFlat: true },
		flatten: { op: 'flatten', radius: 6, strength: 0.5, target: 0, lockTerrain: false, allowFlat: true },
		smooth: { op: 'smooth', radius: 6, strength: 0.5, lockTerrain: false, allowFlat: true },
	},
	get brush() { return this.brushes[this.brushOp]; },
		cleanup: { width: 4, passes: 1 },   // 一键整理的参数：缓降宽度(格数)、平滑类型遍数
		cpuRender: (() => { try { return localStorage.getItem('me_cpuRender') !== '0'; } catch (e) { return true; } })(),   // 2D路/地块用CPU光栅化(无显卡锯齿但慢)还是canvas(GPU，快)
		buildView: false,  // 可建设视图(地形栏开关)：2D底图改成 可建设/不可建设 两色+高度渐变，不显示各地形颜色；只影响显示
		showWater: true,   // 显示水面(2D 底图的蓝色着色 + 3D 水面)；只影响显示，不改数据
		contour: { on: true, interval: 5 },   // 2D等高线(间距单位element=10m，每5条一条主等高线)
	// 路网
	// z=下一个新建节点的高度；zTerrain=改用点击处的地形高度。点在已有节点上沿用它自己的高度。Alt+滚轮快捷调整z。
		road: { shape: 'line', type: 'ground', preset: 0, z: 0, zTerrain: false, snapNode: true, snapRoad: true, snapEdge: true, snapLot: true, snapAngle: true, name: '', tree: 'default', lamp: 'default' },
	pending: null,              // 路/地块正在画的状态
	lotArea: 'AREA_RESIDENCE_HIGH',
	sel: null,                  // {kind:'node'|'road'|'lot'|'green', id}
	colors: {},                 // 地形字符串→自定义颜色
	mouse: null,                // 世界坐标
	warnings: [],
	files: { terrain: null, roadnet: null },
	dirty3d: true, dirty2d: true, terrainDirty: null, terrainVersion: 0,
};
const HISTORY_LIMIT = 80;
const hist = { undo: [], redo: [] };

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function say(text) { const m = $('msg'); m.textContent = text; m.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => { m.style.display = 'none'; }, 3500); }
function ctxHeight() { return { height: (x, y) => S.terrain.sampleHeight(x, y) }; }

// ======================= 撤销/重做 =======================
function pushAction(a) { hist.undo.push(a); if (hist.undo.length > HISTORY_LIMIT) hist.undo.shift(); hist.redo = []; afterChange(); }
function applyAction(a, undo) {
	if (a.kind === 't') {
		S.terrain.applyCells(a.indices, undo ? a.before : a.after);
		markTerrainDirtyIndices(a.indices);
	} else if (a.kind === 'm') {
		S.model = ME.cloneModel(undo ? a.before : a.after);
		if (S.sel && !selExists()) S.sel = null;
		S.pending = null; S.presetDraw = null;
	}
}
function undo() { const a = hist.undo.pop(); if (!a) return; applyAction(a, true); hist.redo.push(a); afterChange(); }
function redo() { const a = hist.redo.pop(); if (!a) return; applyAction(a, false); hist.undo.push(a); afterChange(); }
function clearHistory() { hist.undo = []; hist.redo = []; }

// 对model做一次可撤销的修改；fn返回{error}则整体回滚。
function modelOp(fn) {
	const before = ME.cloneModel(S.model);
	let result;
	try { result = fn(S.model); } catch (e) { result = { error: String(e && e.message || e) }; }
	if (result && result.error) { S.model = before; say(result.error); renderRight(); S.dirty2d = true; return result; }
	pushAction({ kind: 'm', before, after: ME.cloneModel(S.model) });
	return result || {};
}

let piecesCache = null, piecesSig = '';
// 临街路表缓存：按模型内容(节点位置/道路端点控制点类型车道)做签名，签名变了才重算；
// 不能只靠afterChange失效——载入文件、拖动、撤销等路径不一定经过它，缓存过期时地块缩进会算成0。
function getRoadPieces() {
	const M = S.model;
	const sig = M.nodes.map((n) => n.id + ',' + n.x + ',' + n.y + ',' + (n.z || 0)).join(';') + '|' +
		M.roads.map((r) => r.id + ',' + r.a + ',' + r.b + ',' + r.type + ',' + (r.ctrl ? r.ctrl.join(',') : '') + ',' + (r.lanes || []).join(',')).join(';');
	if (!piecesCache || sig !== piecesSig) {
		try { piecesCache = ME.exportRoadnet(M, S.terrain).roadPieces; } catch (e) { piecesCache = new Map(); }
		piecesSig = sig;
	}
	return piecesCache;
}
function afterChange() { S.dirty2d = true; S.dirty3d = true; scheduleWarnings(); updateTop(); renderRight(); }
let warnTimer = 0;
function scheduleWarnings() {
	clearTimeout(warnTimer);
	warnTimer = setTimeout(() => {
		try { const ex = ME.exportRoadnet(S.model, S.terrain); S.warnings = ex.warnings; S.dirty2d = true; } catch (e) { S.warnings = ['检查失败：' + e.message]; }
		updateTop(); renderRight();
	}, 400);
}

// ======================= 文件读写 =======================
async function openFile(accept) {
	if (window.showOpenFilePicker) {
		try {
			const [handle] = await window.showOpenFilePicker({ types: [{ description: accept.name, accept: { 'application/octet-stream': accept.ext } }] });
			const file = await handle.getFile();
			return { name: file.name, buffer: await file.arrayBuffer(), handle };
		} catch (e) { if (e.name === 'AbortError') return null; throw e; }
	}
	return new Promise((resolve) => {
		const input = $('fileInput');
		input.accept = accept.ext.join(',');
		input.onchange = async () => { const f = input.files[0]; input.value = ''; resolve(f ? { name: f.name, buffer: await f.arrayBuffer(), handle: null } : null); };
		input.click();
	});
}
async function saveFile(suggested, data, accept, handle, forceAs) {
	if (window.showSaveFilePicker) {
		try {
			if (!handle || forceAs) handle = await window.showSaveFilePicker({ suggestedName: suggested, types: [{ description: accept.name, accept: { 'application/octet-stream': accept.ext } }] });
			const writable = await handle.createWritable();
			await writable.write(data);
			await writable.close();
			return handle;
		} catch (e) { if (e.name === 'AbortError') return handle; throw e; }
	}
	const blob = new Blob([data], { type: 'application/octet-stream' });
	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob); a.download = suggested; a.click();
	setTimeout(() => URL.revokeObjectURL(a.href), 2000);
	return null;
}
const TERRAIN_FILE = { name: '地形', ext: ['.terrain'] };
const ROADNET_FILE = { name: '路网', ext: ['.roadnet'] };

async function doOpenTerrain() {
	try {
		const f = await openFile(TERRAIN_FILE); if (!f) return;
		S.terrain = ME.readTerrain(f.buffer);
		S.model.mapW = S.terrain.w; S.model.mapH = S.terrain.h;
		S.files.terrain = f.handle; rebuildTerrainImage(); clearHistory(); fitView(); afterChange(); say('已打开 ' + f.name);
	} catch (e) { say('打开地形失败：' + e.message); }
}
async function doSaveTerrain(as) {
	try {
		const data = ME.writeTerrain(S.terrain);
		S.files.terrain = await saveFile('map.terrain', data, TERRAIN_FILE, S.files.terrain, as);
		say('已保存地形');
	} catch (e) { say('保存地形失败：' + e.message); }
}
async function doOpenRoadnet() {
	try {
		const f = await openFile(ROADNET_FILE); if (!f) return;
		const data = ME.readRoadnet(new TextDecoder().decode(f.buffer));
		if (!data.source) throw new Error('这个.roadnet里没有source段(不是编辑器导出的)，无法继续编辑');
		const legacy = !(data.source.version >= 2);
					S.model = ME.migrateModel(data.source, ctxHeight()); S.sel = null; S.pending = null;
		S.files.roadnet = f.handle; clearHistory(); afterChange(); say('已打开 ' + f.name + (legacy ? '(旧版文件，已迁移成节点高度；隧道/桥已按旧布局拆成多条路)' : ''));
	} catch (e) { say('打开路网失败：' + e.message); }
}
// Ctrl+S：地形和路网一起保存(各自已有文件就直接覆盖，没有就各弹一次另存为)。
async function doSaveAll() { await doSaveTerrain(false); await doSaveRoadnet(false); }
async function doSaveRoadnet(as) {
	try {
		const { output, warnings } = ME.exportRoadnet(S.model, S.terrain);
		S.warnings = warnings;
		const text = ME.writeRoadnet(S.model, output);
		S.files.roadnet = await saveFile('map.roadnet', text, ROADNET_FILE, S.files.roadnet, as);
		say('已保存路网' + (warnings.length ? `(有${warnings.length}条警告)` : ''));
		updateTop(); renderRight();
	} catch (e) { say('保存路网失败：' + e.message); }
}
function doNew() {
	const w = parseInt(prompt('地图宽(element，1个=10m；游戏默认1024，必须是2的幂)', '1024'), 10);
	if (!w) return;
	const h = parseInt(prompt('地图高(element)', String(w)), 10);
	if (!h) return;
	if (w * h > 4096 * 4096) { say('太大了'); return; }
	S.terrain = new ME.Terrain(w, h);
	S.model = ME.newModel(w, h);
	S.sel = null; S.pending = null; S.files = { terrain: null, roadnet: null };
	rebuildTerrainImage(); clearHistory(); fitView(); afterChange();
}

// ======================= 2D 视图 =======================
const c2d = $('c2d');
// willReadFrequently=软件(CPU)光栅化：部分显卡/缩放下，GPU画布对近似水平的斜边(路边、地块边)会掉像素，露出一格格没盖到的底图；软件渲染不受影响。
const g = c2d.getContext('2d', { willReadFrequently: true });
let terrCanvas = document.createElement('canvas');
let terrImage = null;

function rebuildTerrainImage() {
	const T = S.terrain;
	terrCanvas.width = T.w; terrCanvas.height = T.h;
	terrImage = terrCanvas.getContext('2d').createImageData(T.w, T.h);
	for (let i = 0; i < T.w * T.h; i++) paintCell(i);
			terrCanvas.getContext('2d').putImageData(terrImage, 0, 0);
			S.terrainVersion++;
			S.dirty2d = true; S.dirty3d = true;
}
function cellRGB(i, noWater) {
	const T = S.terrain;
	let c = ME.colorOf(T.nameAt(i), S.colors);
	const h = T.height[i];
	const shade = 1 + clamp(h * 0.05, -0.45, 0.7);
	let r = c[0] * shade, gg = c[1] * shade, b = c[2] * shade;
	if (!noWater && !isNaN(T.water[i])) { r = r * 0.35 + 30 * 0.65; gg = gg * 0.35 + 90 * 0.65; b = b * 0.35 + 200 * 0.65; }
	return [clamp(r, 0, 255), clamp(gg, 0, 255), clamp(b, 0, 255)];
}
// 可建设视图(只影响2D底图)：按isBuildable分两种底色(绿=可建设，红=不可建设)，再叠加高度渐变(负=偏蓝变暗，正=偏暖变亮)，不显示各地形自己的颜色。
function buildRGB(i) {
	const T = S.terrain;
	const base = T.isBuildable(i % T.w, (i / T.w) | 0) ? [70, 185, 100] : [205, 80, 70];
	const t = clamp(T.height[i] / 15, -1, 1);
	const grad = t < 0
		? [160 + (40 - 160) * -t, 160 + (70 - 160) * -t, 160 + (190 - 160) * -t]
		: [160 + (255 - 160) * t, 160 + (235 - 160) * t, 160 + (150 - 160) * t];
	return [base[0] * 0.55 + grad[0] * 0.45, base[1] * 0.55 + grad[1] * 0.45, base[2] * 0.55 + grad[2] * 0.45];
}
function paintCell(i) {
	const [r, gg, b] = S.buildView ? buildRGB(i) : cellRGB(i, !S.showWater);
	terrImage.data[i * 4] = r; terrImage.data[i * 4 + 1] = gg; terrImage.data[i * 4 + 2] = b; terrImage.data[i * 4 + 3] = 255;
}
function repaintTerrainImage() { // 只重涂颜色(显隐水面)：不动地形数据，不触发等高线重算
	for (let i = 0; i < S.terrain.w * S.terrain.h; i++) paintCell(i);
	terrCanvas.getContext('2d').putImageData(terrImage, 0, 0);
	S.terrainDirty = null; S.dirty2d = true; S.dirty3d = true;
}
function markTerrainDirtyIndices(indices) {
	const T = S.terrain;
	let r = S.terrainDirty;
	// 可建设视图下，一个格子的高度变了会影响它3x3邻域里所有格子的可建设状态，所以外扩一圈一起重涂。
	const grow = S.buildView ? 1 : 0;
	const seen = grow ? new Set() : null;
	for (const i of indices) {
		const x = i % T.w, y = (i / T.w) | 0;
		for (let dy = -grow; dy <= grow; dy++) for (let dx = -grow; dx <= grow; dx++) {
			const nx = x + dx, ny = y + dy;
			if (nx < 0 || ny < 0 || nx >= T.w || ny >= T.h) continue;
			const j = ny * T.w + nx;
			if (seen) { if (seen.has(j)) continue; seen.add(j); }
			if (!r) r = { x0: nx, y0: ny, x1: nx, y1: ny };
			else { r.x0 = Math.min(r.x0, nx); r.y0 = Math.min(r.y0, ny); r.x1 = Math.max(r.x1, nx); r.y1 = Math.max(r.y1, ny); }
			paintCell(j);
		}
	}
	S.terrainDirty = r; S.terrainVersion++; S.dirty2d = true; S.dirty3d = true;
}
function flushTerrainImage() {
	const r = S.terrainDirty; if (!r) return;
	terrCanvas.getContext('2d').putImageData(terrImage, 0, 0, r.x0, r.y0, r.x1 - r.x0 + 1, r.y1 - r.y0 + 1);
	S.terrainDirty = null;
}
function resize2d() {
	const rect = $('center').getBoundingClientRect();
	const dpr = window.devicePixelRatio || 1;
	c2d.width = Math.max(1, Math.floor(rect.width * dpr)); c2d.height = Math.max(1, Math.floor(rect.height * dpr));
	S.dirty2d = true;
}
function fitView() {
	const rect = $('center').getBoundingClientRect();
	S.view.scale = Math.max(0.2, Math.min(rect.width / S.terrain.w, rect.height / S.terrain.h) * 0.95);
	S.view.ox = (rect.width - S.terrain.w * S.view.scale) / 2; S.view.oy = (rect.height - S.terrain.h * S.view.scale) / 2;
	S.dirty2d = true;
}
const toWorld = (sx, sy) => [(sx - S.view.ox) / S.view.scale, (sy - S.view.oy) / S.view.scale];
const toScreen = (x, y) => [x * S.view.scale + S.view.ox, y * S.view.scale + S.view.oy];

const ROAD_COLORS = { ground: '#4a4f58', hug: '#6f8f5a', mouth: '#7a4b9a', tunnel: '#b46ae0', bridge: '#e0962f' };
const ROAD_TYPES = [['ground', '平地'], ['hug', '贴合地形'], ['mouth', '隧道口'], ['tunnel', '隧道'], ['bridge', '桥']];
// 地块类型颜色：住宅=浅绿/深绿/墨绿，商业=浅蓝/深蓝/藏蓝，工业=浅黄/深黄/棕，办公=浅粉/深粉/紫(都是 低/中/高)，测试=红，绿化=青。必须是6位hex(后面会拼透明度后缀)。
const AREA_COLORS = {
	AREA_RESIDENCE_LOW: '#86efac', AREA_RESIDENCE_MIDDLE: '#16a34a', AREA_RESIDENCE_HIGH: '#14532d',
	AREA_COMMERCE_LOW: '#7dd3fc', AREA_COMMERCE_MIDDLE: '#2563eb', AREA_COMMERCE_HIGH: '#1e2a78',
	AREA_INDUSTRY_LOW: '#fde68a', AREA_INDUSTRY_MIDDLE: '#eab308', AREA_INDUSTRY_HIGH: '#92400e',
	AREA_OFFICE_LOW: '#f9a8d4', AREA_OFFICE_MIDDLE: '#db2777', AREA_OFFICE_HIGH: '#7e22ce',
	AREA_TEST: '#ef4444', AREA_PLACEHOLDER: '#a3a3a3',
};
const areaColor = (area) => AREA_COLORS[area] || '#888888';

function pathQuad(q) {
	const poly = ME.polyline(q);
	g.beginPath();
	poly.forEach((p, i) => { const [sx, sy] = toScreen(p.x, p.y); if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy); });
}
// ---- 软件光栅化：路和地块自己在CPU上抗锯齿填充再贴到画布 ----
// 部分显卡/Chrome硬件加速下，canvas2D的粗描边和相邻填充会在斜边上掉像素(露出底图)，所以这些矢量图形不交给canvas路径，自己画进像素缓冲。
const RS = { w: 0, h: 0, buf: null, canvas: document.createElement('canvas'), id: null };
function rsBegin() {
	const W = c2d.width, H = c2d.height;
	if (RS.w !== W || RS.h !== H || !RS.buf) { RS.w = W; RS.h = H; RS.buf = new Float32Array(W * H * 4); RS.canvas.width = W; RS.canvas.height = H; RS.id = null; }
	RS.buf.fill(0);
}
function hexRGBA(c) {
	const h = c.replace('#', '');

			const [gx1, gy1] = toScreen(guide.origin[0] + guide.dir[0] * reach, guide.origin[1] + guide.dir[1] * reach);
			g.save(); g.setLineDash([2, 4]); g.strokeStyle = '#ffd24c'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(gx0, gy0); g.lineTo(gx1, gy1); g.stroke();
			if (S.road.shape === 'curve') { const [cx, cy] = toScreen(guide.point[0], guide.point[1]); g.setLineDash([]); g.fillStyle = '#ffd24c'; g.beginPath(); g.arc(cx, cy, 4, 0, Math.PI * 2); g.fill(); }
			g.restore();
		}
	}
	if (S.tool === 'road') {
		const sp = roadSnap;
		const [sx, sy] = toScreen(sp.point[0], sp.point[1]);
		g.strokeStyle = sp.kind === 'free' ? '#aaa' : '#4cff9e'; g.lineWidth = 2;
		g.beginPath(); g.arc(sx, sy, 7, 0, Math.PI * 2); g.stroke();
	}
	if (S.tool === 'lot' && S.pending) {
		const lot = lotPreview();
		if (lot) {
			const corners = ME.lotCorners(S.model, lot);
			if (corners) {
				g.beginPath();
				corners.forEach((c, i) => { const [sx, sy] = toScreen(c[0], c[1]); if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy); });
				g.closePath(); g.fillStyle = areaColor(S.lotArea) + '55'; g.fill(); g.setLineDash([6, 4]); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); g.setLineDash([]);
			}
		} else if (S.pending.a !== undefined) {
			const a = ME.nodeOf(S.model, S.pending.a); const [sx, sy] = toScreen(a.x, a.y); const [ex, ey] = toScreen(m[0], m[1]);
			g.setLineDash([6, 4]); g.strokeStyle = '#fff'; g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke(); g.setLineDash([]);
		}
	}
	if (S.tool === 'green') drawGreenOverlay(m);
	if (S.presetDraw) drawPresetOverlay(m);
	else if (S.tool === 'lot' && S.mouse) {
		const n = ME.pickNode(S.model, m[0], m[1], 9 / v.scale);
		if (n) { const [sx, sy] = toScreen(n.x, n.y); g.strokeStyle = '#4cff9e'; g.lineWidth = 2; g.beginPath(); g.arc(sx, sy, 8, 0, Math.PI * 2); g.stroke(); }
	}
}

// 路工具的落点：节点(吸附) / 路上(T口) / 地图边界(城外连接点) / 自由点。返回 {kind, point:[x,y], ref}
const ANGLE_SNAP_DEG = 10;
// 吸附角度：起点是已连了道路的节点(或路中间)时，终点(直线)/控制点(曲线)吸到垂直(直角)或沿已连道路延长(平角，只限节点)的射线上。
function angleSnap(w) {
	const p = S.pending;
	if (!S.road.snapAngle || !p || !p.a.ref) return null;
	const origin = p.a.ref.node !== undefined ? { node: p.a.ref.node } : (p.a.ref.road !== undefined ? { road: p.a.ref.road, t: p.a.ref.t } : null);
	return origin ? ME.angleSnapAt(S.model, origin, w[0], w[1], ANGLE_SNAP_DEG) : null;
}
// 路工具的落点：吸附角度优先于路中间/自由点，但显式落在节点/城外连接点上时以那个目标为准。
function snapPoint(w) {
	const base = snapPointBase(w);
	if (base.kind === 'node' || base.kind === 'extern' || base.kind === 'corner') return base;
	const p = S.pending;
	if (!p || S.road.shape !== 'line') return base;
	let ra = angleSnap(w);
	if (!ra) return base;
	// 射线刚好穿过另一条路：落在那条路上建T口。沿射线迭代两次，让落点贴近射线。
	if (S.road.snapRoad) {
		const r = 9 / S.view.scale;
		let pt = ra.point;
		for (let i = 0; i < 2; i++) {
			const hit = ME.pickRoad(S.model, pt[0], pt[1], r);
			if (!hit) break;
			const along = (hit.x - ra.origin[0]) * ra.dir[0] + (hit.y - ra.origin[1]) * ra.dir[1];
			pt = [ra.origin[0] + ra.dir[0] * along, ra.origin[1] + ra.dir[1] * along];
		}
		const hit = ME.pickRoad(S.model, pt[0], pt[1], r);
		if (hit && ME.canSplit(hit.road)) return { kind: 'road', point: [hit.x, hit.y], ref: { road: hit.road.id, t: hit.t }, angleSnap: ra };
	}
	return { kind: 'free', point: ra.point, ref: { x: ra.point[0], y: ra.point[1] }, angleSnap: ra };
}

// 最近的地块角点(屏幕9像素内)。excludeNode：正在拖的节点，它自己连着的地块角点会跟着动，不参与吸附。
function lotCornerSnap(w, excludeNode) {
	const M = S.model, r = 9 / S.view.scale;
	let best = null, bd = r;
	for (const lot of M.lots) {
		if (excludeNode !== null && (lot.a === excludeNode || lot.b === excludeNode)) continue;
		const cs = ME.lotCorners(M, lot);
		if (!cs) continue;
		for (const c of cs) { const d = Math.hypot(c[0] - w[0], c[1] - w[1]); if (d < bd) { bd = d; best = [c[0], c[1]]; } }
	}
	return best;
}

function snapPointBase(w) {
	const M = S.model, r = 9 / S.view.scale, R = S.road;
	const free = { kind: 'free', point: w, ref: { x: w[0], y: w[1] } };
	// 四种吸附各自独立开关：节点 / 地图边界(城外连接点) / 道路(路中间建T口) / 角度(在snapPoint里)。
	if (R.snapNode) {
		const node = ME.pickNode(M, w[0], w[1], r);
		if (node) return { kind: 'node', point: [node.x, node.y], ref: { node: node.id } };
	}
	if (R.snapLot) {
		const c = lotCornerSnap(w, null);
		if (c) return { kind: 'corner', point: c, ref: { x: c[0], y: c[1] } };
	}
	if (R.snapEdge) {
		const edgeR = Math.max(r, 1.2);
		const W = S.terrain.w, H = S.terrain.h;
		const dists = [w[0], w[1], W - w[0], H - w[1]];
		const k = dists.indexOf(Math.min(...dists));
		if (dists[k] <= edgeR) {
			const p = k === 0 ? [0, w[1]] : k === 1 ? [w[0], 0] : k === 2 ? [W, w[1]] : [w[0], H];
			const existing = M.nodes.find((n) => n.extern && Math.hypot(n.x - p[0], n.y - p[1]) < 0.3);
			if (existing) return { kind: 'node', point: [existing.x, existing.y], ref: { node: existing.id } };
			return { kind: 'extern', point: p, ref: { x: p[0], y: p[1], extern: true } };
		}
	}
	if (R.snapRoad) {
		const hit = ME.pickRoad(M, w[0], w[1], r);
		if (hit && ME.canSplit(hit.road)) return { kind: 'road', point: [hit.x, hit.y], ref: { road: hit.road.id, t: hit.t } };
	}
	return free;
}

// ======================= 地块工具 =======================
function lotPreview() {
	const p = S.pending;
	if (!p || p.a === undefined || p.b === undefined || !S.mouse) return null;
	const a = ME.nodeOf(S.model, p.a), b = ME.nodeOf(S.model, p.b);
	const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
	if (len < 1e-6) return null;
	const nx = -dy / len, ny = dx / len;
	let depth = (S.mouse[0] - b.x) * nx + (S.mouse[1] - b.y) * ny;
	// 深度吸附：另一侧角点正好有节点时对齐(这样那条边才能有临街的路)。
	for (const n of S.model.nodes) {
		if (n.id === a.id || n.id === b.id) continue;
		const d = (n.x - b.x) * nx + (n.y - b.y) * ny;
		const along = (n.x - b.x) * (dx / len) + (n.y - b.y) * (dy / len);
		if (Math.abs(along) < 0.4 && Math.abs(d - depth) < 8 / S.view.scale) { depth = d; break; }
	}
	depth = Math.round(depth * 100) / 100;
	if (Math.abs(depth) < 0.5) return null;
	return { id: -1, a: p.a, b: p.b, depth, area: S.lotArea, margin: [null, null, null, null] };
}

// ======================= 绿化工具 =======================
// 画多边形：连续点顶点，鼠标靠近第一个点时点击=闭合成环(至少3点、边不能相交，凹多边形可以)；Backspace撤销最后一点，Esc/右键点一下取消。
// 连接道路：先点绿化的某条边(高亮)，再点一条路；一条边只连一条路，重复点覆盖；在右侧面板里可以删除连接。
function greenSnap(w) {
	const ring = S.pending && S.pending.green ? S.pending.green.pts : [];
	if (ring.length >= 3 && Math.hypot(w[0] - ring[0][0], w[1] - ring[0][1]) <= 10 / S.view.scale) return { point: ring[0].slice(), close: true };
	const n = ME.pickNode(S.model, w[0], w[1], 9 / S.view.scale);
	if (n) return { point: [n.x, n.y], close: false };
	return { point: [w[0], w[1]], close: false };
}
function greenClick(w) {
	const M = S.model, r = 9 / S.view.scale;
	if (S.greenMode === 'link') {
		const p = S.pending && S.pending.linkGreen !== undefined ? S.pending : null;
		if (p) {
			const hit = ME.pickRoad(M, w[0], w[1], Math.max(r, 0.6));
			if (hit) {
				const gid = p.linkGreen, edge = p.edge;
				S.pending = null;
				modelOp((m) => { const gr = ME.greenOf(m, gid); if (!gr) return { error: '绿化已不存在' }; ME.setGreenLink(gr, edge, ME.roadOf(m, hit.road.id), hit.t, hit.x, hit.y); });
				say('已把绿化的这条边连到 ' + (hit.road.name || ('路' + hit.road.id)));
				S.dirty2d = true; return;
			}
		}
		const e = ME.pickGreenEdge(M, w[0], w[1], r);
		if (e) { S.pending = { linkGreen: e.green.id, edge: e.edge }; S.sel = { kind: 'green', id: e.green.id }; renderRight(); }
		else say(p ? '点一条路(或点别的绿化边重新选)' : '先点绿化区的一条边');
		S.dirty2d = true; return;
	}
	// 画多边形
	if (!S.pending || !S.pending.green) S.pending = { green: { pts: [] } };
	const ring = S.pending.green.pts;
	const sp = greenSnap(w);
	if (sp.close) {
		if (!ME.canCloseGreen(ring)) { say('不能闭合：边自相交或面积为0'); return; }
		const pts = ring.map((q) => q.slice());
		S.pending = null;
		const res = modelOp((m) => ({ green: ME.addGreen(m, pts) }));
		if (res.green) { S.sel = { kind: 'green', id: res.green.id }; renderRight(); }
		S.dirty2d = true; return;
	}
	if (!ME.canAppendVertex(ring, sp.point)) { say('这条边会和已画的边相交'); return; }
	ring.push(sp.point);
	S.dirty2d = true;
}
// 已有绿化连到路的连接：边加粗成橙色，从边上最近点连到路上的落点(路已不存在=红色)。
function drawGreenLinks() {
	const M = S.model;
	const showVerts = S.tool === 'green';
	for (const gr of M.greens) {
		const n = gr.pts.length;
		for (const link of gr.links) {
			if (link.edge < 0 || link.edge >= n) continue;
			const a = gr.pts[link.edge], b = gr.pts[(link.edge + 1) % n];
			const ok = !!ME.resolveGreenLink(M, link);
			const [ax, ay] = toScreen(a[0], a[1]), [bx, by] = toScreen(b[0], b[1]);
			g.setLineDash([]); g.strokeStyle = ok ? '#ffb347' : '#e5534b'; g.lineWidth = 3.5;
			g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
			const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
			const [sx, sy] = toScreen(mx, my), [tx, ty] = toScreen(link.x, link.y);
			g.setLineDash([4, 3]); g.lineWidth = 1.5;
			g.beginPath(); g.moveTo(sx, sy); g.lineTo(tx, ty); g.stroke(); g.setLineDash([]);
			g.fillStyle = ok ? '#ffb347' : '#e5534b'; g.beginPath(); g.arc(tx, ty, 3, 0, Math.PI * 2); g.fill();
		}
		const selected = S.sel && S.sel.kind === 'green' && S.sel.id === gr.id;
		if (showVerts || selected) {
			g.fillStyle = '#ffffff'; g.strokeStyle = '#1a5a2a'; g.lineWidth = 1.5;
			for (const p of gr.pts) { const [sx, sy] = toScreen(p[0], p[1]); g.beginPath(); g.arc(sx, sy, 3.5, 0, Math.PI * 2); g.fill(); g.stroke(); }
		}
	}
}
function drawGreenOverlay(m) {
	const M = S.model, v = S.view;
	if (S.greenMode === 'link') {
		const p = S.pending && S.pending.linkGreen !== undefined ? S.pending : null;
		const hov = ME.pickGreenEdge(M, m[0], m[1], 9 / v.scale);
		const strokeEdge = (gr, edge, color, w) => {
			const a = gr.pts[edge], b = gr.pts[(edge + 1) % gr.pts.length];
			const [ax, ay] = toScreen(a[0], a[1]), [bx, by] = toScreen(b[0], b[1]);
			g.setLineDash([]); g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
		};
		if (hov) strokeEdge(hov.green, hov.edge, '#ffffffaa', 4);
		if (p) {
			const gr = ME.greenOf(M, p.linkGreen);
			if (gr) strokeEdge(gr, p.edge, '#4cc9ff', 4.5);
			const road = ME.pickRoad(M, m[0], m[1], Math.max(9 / v.scale, 0.6));
			if (road) { pathQuad(ME.quadOf(M, road.road)); g.strokeStyle = '#4cc9ff'; g.lineWidth = 3; g.setLineDash([]); g.stroke(); }
		}
		return;
	}
	const ring = S.pending && S.pending.green ? S.pending.green.pts : null;
	const sp = greenSnap(m);
	if (ring && ring.length) {
		g.setLineDash([]); g.strokeStyle = '#7ee08f'; g.lineWidth = 2; g.beginPath();
		ring.forEach((q, i) => { const [sx, sy] = toScreen(q[0], q[1]); if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy); });
		g.stroke();
		const bad = sp.close ? !ME.canCloseGreen(ring) : !ME.canAppendVertex(ring, sp.point);
		const last = ring[ring.length - 1];
		const [lx, ly] = toScreen(last[0], last[1]), [ex, ey] = toScreen(sp.point[0], sp.point[1]);
		g.setLineDash([6, 4]); g.strokeStyle = bad ? '#e5534b' : '#fff'; g.beginPath(); g.moveTo(lx, ly); g.lineTo(ex, ey); g.stroke(); g.setLineDash([]);
		g.fillStyle = '#fff'; for (const q of ring) { const [sx, sy] = toScreen(q[0], q[1]); g.beginPath(); g.arc(sx, sy, 3.5, 0, Math.PI * 2); g.fill(); }
		if (ring.length >= 3) { const [fx, fy] = toScreen(ring[0][0], ring[0][1]); g.strokeStyle = sp.close ? '#4cff9e' : '#7ee08f'; g.lineWidth = 2; g.beginPath(); g.arc(fx, fy, 8, 0, Math.PI * 2); g.stroke(); }
	}
	const [sx, sy] = toScreen(sp.point[0], sp.point[1]);
	g.strokeStyle = sp.close ? '#4cff9e' : '#aaa'; g.lineWidth = 2; g.beginPath(); g.arc(sx, sy, 7, 0, Math.PI * 2); g.stroke();
}

// ======================= 鼠标交互 =======================
let drag = null;
c2d.addEventListener('contextmenu', (e) => e.preventDefault());
c2d.addEventListener('mousedown', (e) => {
	const rect = c2d.getBoundingClientRect();
	const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
	const w = toWorld(sx, sy);
	S.mouse = w;
	// Alt+左键：路网/地块工具里是"选择"(空地取消选择)；右键/中键/空格+左键是平移，右键点一下(不拖)结束正在画的路/地块。
	if (e.button === 0 && e.altKey && (S.tool === 'road' || S.tool === 'lot' || S.tool === 'green')) { selectClick(w, e, S.tool); return; }
	if (e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown)) {
		drag = { type: 'pan', rc: e.button === 2, moved: false, sx, sy, ox: S.view.ox, oy: S.view.oy }; return;
	}
	if (e.button !== 0) return;
	if (S.tool === 'terrain') {
			S.terrain.beginStroke();
			// 限定单一地形：按下时笔刷中心所在格的地形，整次笔画都只改这个地形的格子。
			let only;
			if (S.brush.lockTerrain && HEIGHT_OPS.includes(S.brush.op)) {
				const x = Math.floor(w[0]), y = Math.floor(w[1]);
				if (S.terrain.inside(x, y)) only = S.terrain.idx[y * S.terrain.w + x];
			}
			drag = { type: 'brush', only };
			applyBrush(w, only);
			return;
		}
	if (S.tool === 'road') {
		if (e.detail === 1) dblPendingBefore = !!S.pending;
		if (e.detail === 2) { doubleClickSplit(w); return; }
		roadClick(w); return;
	}
	if (S.tool === 'lot') { if (S.presetDraw) presetClick(w); else lotClick(w); return; }
	if (S.tool === 'green') { greenClick(w); return; }
});
window.addEventListener('mousemove', (e) => {
	const rect = c2d.getBoundingClientRect();
	const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
	const w = toWorld(sx, sy);
	S.mouse = (sx >= 0 && sy >= 0 && sx <= rect.width && sy <= rect.height) || drag ? w : null;
	updateStatus();
	if (drag) {
		if (drag.type === 'pan') { if (Math.hypot(sx - drag.sx, sy - drag.sy) > 4) drag.moved = true; S.view.ox = drag.ox + (sx - drag.sx); S.view.oy = drag.oy + (sy - drag.sy); }
		else if (drag.type === 'brush') applyBrush(w, drag.only);
		else if (drag.type === 'box') { drag.x1 = w[0]; drag.y1 = w[1]; drag.moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 4; }
		else if (drag.type === 'node') { const n = ME.nodeOf(S.model, drag.id); const lc = S.road.snapLot ? lotCornerSnap(w, drag.id) : null; ME.moveNode(S.model, drag.id, lc ? lc[0] : snapToGrid(w[0], e), lc ? lc[1] : snapToGrid(w[1], e)); drag.moved = true; S.dirty3d = true; void n; }
		else if (drag.type === 'ctrl') { const r = ME.roadOf(S.model, drag.id); if (r) { r.ctrl = [w[0], w[1]]; drag.moved = true; S.dirty3d = true; } }
	}
	S.dirty2d = true;
});
window.addEventListener('mouseup', () => {
	if (!drag) return;
	if (drag.type === 'pan' && drag.rc && !drag.moved && S.presetDraw) cancelPreset();
	else if (drag.type === 'pan' && drag.rc && !drag.moved && S.pending) S.pending = null; // 右键点一下(没拖动)：结束正在画的路/地块
	if (drag.type === 'box') {
		if (drag.moved) {
			const xa = Math.min(drag.x0, drag.x1), xb = Math.max(drag.x0, drag.x1), ya = Math.min(drag.y0, drag.y1), yb = Math.max(drag.y0, drag.y1);
			const ids = S.model.nodes.filter((n) => n.x >= xa && n.x <= xb && n.y >= ya && n.y <= yb).map((n) => n.id);
			S.sel = ids.length ? { kind: 'nodes', ids } : null;
			renderRight();
		}
	}
	else if (drag.type === 'brush') { const a = S.terrain.endStroke(); if (a) pushAction(Object.assign({ kind: 't' }, a)); }
	else if (drag.type === 'node' || drag.type === 'ctrl') {
		if (drag.moved) pushAction({ kind: 'm', before: drag.before, after: ME.cloneModel(S.model) });
		else S.model = ME.cloneModel(drag.before);
	}
	drag = null; S.dirty2d = true;
});
const snapToGrid = (v, e) => (e && e.altKey ? Math.round(v) : v);
c2d.addEventListener('wheel', (e) => {
	e.preventDefault();
	// Alt+滚轮：路网工具里调整下一个新建节点的高度(步长0.5，不再跟地形)。
	if (e.altKey && S.tool === 'road') {
		S.road.zTerrain = false;
		S.road.z = Math.round((S.road.z + (e.deltaY < 0 ? 0.5 : -0.5)) * 100) / 100;
		say('节点高度 ' + S.road.z.toFixed(1)); renderLeft(); S.dirty2d = true; return;
	}
	const rect = c2d.getBoundingClientRect();
	const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
	const [wx, wy] = toWorld(sx, sy);
	S.view.scale = clamp(S.view.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 0.15, 80);
	S.view.ox = sx - wx * S.view.scale; S.view.oy = sy - wy * S.view.scale;
	S.dirty2d = true;
}, { passive: false });
let spaceDown = false;
window.addEventListener('keydown', (e) => {
	if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.key !== 'Escape') return;
	if (e.key === ' ') { spaceDown = true; e.preventDefault(); }
	else if (e.key === 'Escape') { S.pending = null; S.presetDraw = null; S.dirty2d = true; renderRight(); }

function el(tag, props, ...kids) {
	const e = document.createElement(tag);
	for (const k in (props || {})) {
		if (k === 'class') e.className = props[k];
		else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
		else if (k === 'value') e.value = props[k];
		else if (props[k] === null || props[k] === undefined || props[k] === false) continue; // null/false=不设这个属性(setAttribute会把它变成字符串"null"，让checked之类永远为真)
		else if (k === 'checked') e.checked = !!props[k];
		else e.setAttribute(k, props[k]);
	}
	for (const kid of kids) if (kid !== null && kid !== undefined) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
	return e;
}

			right.append(row('id', el('input', { type: 'text', value: p.modId || '', placeholder: 'zone_xxx 或 building_xxx', onchange: (e) => modelOp((m) => { const h = (m.lots.flatMap((l) => l.presets || [])).find((q) => q.id === p.id); if (h) h.modId = e.target.value.trim(); }) })));
			right.append(row('临街', el('span', null, ME.DIRECTION_NAMES[p.dir] + '边')));
			const pl = step && step.placed ? step.placed : p;
			right.append(row('尺寸', el('span', null, `${(pl.x1 - pl.x0).toFixed(1)} × ${(pl.y1 - pl.y0).toFixed(1)}  (${((pl.x1 - pl.x0) * 10).toFixed(0)}m × ${((pl.y1 - pl.y0) * 10).toFixed(0)}m)`)));
			if (step && step.error) right.append(el('div', { class: 'warn' }, '无效：' + step.error));
			right.append(el('div', { class: 'hint' }, 'id 以 zone_ 开头=园区，否则=建筑；游戏里该 mod 必须已启用。'));
			right.append(btn('返回地块', () => { S.sel = { kind: 'lot', id: lot.id }; renderRight(); S.dirty2d = true; }));
			right.append(btn('删除预设', deleteSelection));
	} else {
		const lot = M.lots.find((l) => l.id === S.sel.id);
		right.append(el('div', null, `地块 ${lot.id}`));
		right.append(row('类型', sel(ME.AREAS.map((a) => [a, areaLabel(a)]), lot.area, (v) => modelOp((m) => { m.lots.find((l) => l.id === lot.id).area = v; }))));
		right.append(row('深度', num(lot.depth.toFixed(2), (v) => modelOp((m) => { if (v) m.lots.find((l) => l.id === lot.id).depth = v; }), { step: 0.5 })));
		const info = ME.describeLot(M, lot, roadPiecesForUI());
		if (info) {
			right.append(el('h4', null, '四向缩进(留空=自动)'));
			info.directions.forEach((d, i) => {
				const input = el('input', { type: 'number', step: 0.1, placeholder: d.auto.toFixed(2), value: d.custom === null ? '' : d.custom });
				input.addEventListener('change', () => modelOp((m) => { m.lots.find((l) => l.id === lot.id).margin[i] = input.value === '' ? null : parseFloat(input.value); }));
				right.append(row(d.name, input, el('span', { class: 'hint' }, d.road ? '临街 ' + (d.road.name || d.road.id) : '无路')));
			});
		}
			right.append(el('h4', null, `园区/建筑预设(${(lot.presets || []).length})`));
		if (S.presetDraw && S.presetDraw.lotId === lot.id) right.append(el('div', { class: 'hint' }, ['', '点沿路段起点(靠近有路的边)', '点沿路段终点', '移动鼠标定进深，点击确定'][S.presetDraw.step] + '；Esc/右键取消'), btn('取消添加', cancelPreset));
		else right.append(btn('添加预设', startPreset));
		for (const p of lot.presets || []) right.append(btn(`预设${p.id}  ${p.modId || '(未填id)'}`, () => { S.sel = { kind: 'preset', id: p.id, lotId: lot.id }; renderRight(); S.dirty2d = true; }));
		right.append(btn('删除地块', deleteSelection));
	}
	right.append(el('h4', null, `检查(${S.warnings.length})`));
	if (!S.warnings.length) right.append(el('div', { class: 'hint' }, '没有问题'));
	for (const w of S.warnings.slice(0, 60)) right.append(el('div', { class: 'warn' }, w));
}
// 节点高度编辑行：数字 + "=地形"按钮(把这个节点的高度设成它所在位置的地形高度)。
function nodeHeightRow(n, label) {
	const terrainZ = S.terrain.sampleHeight(n.x, n.y);
	return row(label || '高度',
		num((n.z || 0).toFixed(2), (v) => modelOp((m) => { ME.nodeOf(m, n.id).z = isNaN(v) ? 0 : v; }), { step: 0.5 }),
		el('button', { title: '把这个节点的高度设成它所在位置的地形高度(' + terrainZ.toFixed(2) + ')', onclick: () => modelOp((m) => { const nn = ME.nodeOf(m, n.id); nn.z = S.terrain.sampleHeight(nn.x, nn.y); }) }, '=地形'));
}
function roadPiecesForUI() {
	try { return ME.exportRoadnet(S.model, S.terrain).roadPieces; } catch (e) { return new Map(); }
}

// ======================= 3D 视图 =======================
let r3 = null;
function setMode3d(on) {
	S.mode3d = on;
	$('c2d').style.display = on ? 'none' : 'block';
	$('c3dWrap').style.display = on ? 'block' : 'none';
	if (on) { if (!r3) init3D(); resize3d(); S.dirty3d = true; } else S.dirty2d = true;
	updateTop();
}
function init3D() {
	const canvas = $('c3d');
	const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
	const scene = new THREE.Scene();
	scene.background = new THREE.Color(0x15171a);
	const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
	scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.5));
	const sun = new THREE.DirectionalLight(0xffffff, 0.45); sun.position.set(-1, 2, 1); scene.add(sun);
	r3 = { renderer, scene, camera, root: new THREE.Group(), cam: { yaw: 0.6, pitch: 0.8, dist: 200, target: new THREE.Vector3(128, 0, 128) } };
	scene.add(r3.root);
	let d3 = null;
	canvas.addEventListener('contextmenu', (e) => e.preventDefault());
	canvas.addEventListener('mousedown', (e) => { d3 = { x: e.clientX, y: e.clientY, button: e.button }; });
	window.addEventListener('mouseup', () => { d3 = null; });
	window.addEventListener('mousemove', (e) => {
		if (!d3) return;
		const dx = e.clientX - d3.x, dy = e.clientY - d3.y; d3.x = e.clientX; d3.y = e.clientY;
		const c = r3.cam;
		if (d3.button === 0) { c.yaw -= dx * 0.005; c.pitch = clamp(c.pitch + dy * 0.005, 0.05, 1.55); }
		else {
			const k = c.dist * 0.0015;
			const right = new THREE.Vector3(Math.cos(c.yaw), 0, -Math.sin(c.yaw)), fwd = new THREE.Vector3(-Math.sin(c.yaw), 0, -Math.cos(c.yaw));
			c.target.addScaledVector(right, -dx * k).addScaledVector(fwd, dy * k);
		}
	});
	canvas.addEventListener('wheel', (e) => { e.preventDefault(); r3.cam.dist = clamp(r3.cam.dist * (e.deltaY < 0 ? 0.88 : 1.14), 5, 4000); }, { passive: false });
	r3.cam.target.set(S.terrain.w / 2, 0, S.terrain.h / 2); r3.cam.dist = Math.max(S.terrain.w, S.terrain.h) * 0.9;
}
function resize3d() {
	if (!r3) return;
	const rect = $('center').getBoundingClientRect();
	r3.renderer.setPixelRatio(window.devicePixelRatio || 1);
	r3.renderer.setSize(rect.width, rect.height, false);
	r3.camera.aspect = rect.width / rect.height; r3.camera.updateProjectionMatrix();
}
function bezier3(points, t) {
	let pts = points.map((p) => p.slice());
	for (let n = pts.length - 1; n > 0; n--) for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) pts[i][k] = pts[i][k] * (1 - t) + pts[i + 1][k] * t;
	return pts[0];
}
function disposeGroup(group) {
	while (group.children.length) {
		const c = group.children.pop();
		if (c.geometry) c.geometry.dispose();
		if (c.material) c.material.dispose();
	}
}
function build3D() {
	disposeGroup(r3.root);
	const T = S.terrain;
	// 按格子画：element(x,y)=[x,x+1]x[y,y+1]一块面片，整格一个颜色；四角高度取格点高度(和游戏、sampleHeight同一套，越界取边缘)。
	// 用flatShading(按三角面算光照，不用顶点法线)：平地格光照恒定，坡面的暗色只留在坡面自己那一格，不会插值到相邻格子。
	// 格子数超过1024x1024时每step x step格合成一块(取块左上格的颜色)。
	const step = Math.max(1, Math.ceil(Math.max(T.w, T.h) / 1024));
	const bw = Math.ceil(T.w / step), bh = Math.ceil(T.h / step);
	const HL = (x, y) => T.height[Math.min(T.h - 1, y) * T.w + Math.min(T.w - 1, x)];
	const pos = new Float32Array(bw * bh * 12), col = new Uint8Array(bw * bh * 12);
	const index = new Uint32Array(bw * bh * 6);
	for (let by = 0; by < bh; by++) for (let bx = 0; bx < bw; bx++) {
		const x = bx * step, y = by * step, x2 = Math.min(T.w, x + step), y2 = Math.min(T.h, y + step);
		const c = cellRGB(y * T.w + x, true), blk = by * bw + bx, v0 = blk * 4;
		const cx = [x, x2, x, x2], cy = [y, y, y2, y2];
		for (let k = 0; k < 4; k++) {
			const o = (v0 + k) * 3;
			pos[o] = cx[k]; pos[o + 1] = HL(cx[k], cy[k]); pos[o + 2] = cy[k];
			col[o] = c[0]; col[o + 1] = c[1]; col[o + 2] = c[2];
		}
		const o6 = blk * 6;
		index[o6] = v0; index[o6 + 1] = v0 + 2; index[o6 + 2] = v0 + 1; index[o6 + 3] = v0 + 1; index[o6 + 4] = v0 + 2; index[o6 + 5] = v0 + 3;
	}
	const geo = new THREE.BufferGeometry();
	geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3, true));
	geo.setIndex(new THREE.BufferAttribute(index, 1));
	r3.root.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide })));
	// 水面：只有高过地形才可见——四角地形都不低于水位的格子跳过(其余部分由深度测试被地面挡住)。
	const wetCell = (x, y) => {
		const lv = T.water[y * T.w + x];
		if (isNaN(lv)) return NaN;
		const x2 = Math.min(T.w, x + step), y2 = Math.min(T.h, y + step);
		return Math.min(HL(x, y), HL(x2, y), HL(x, y2), HL(x2, y2)) >= lv ? NaN : lv;
	};
	let wetCount = 0;
	for (let y = 0; y < T.h; y += step) for (let x = 0; x < T.w; x += step) if (!isNaN(wetCell(x, y))) wetCount++;
	if (wetCount && S.showWater) {
		const wp = new Float32Array(wetCount * 18);
		let o = 0;
		for (let y = 0; y < T.h; y += step) for (let x = 0; x < T.w; x += step) {
			const lv = wetCell(x, y);
			if (isNaN(lv)) continue;
			const x2 = Math.min(T.w, x + step), y2 = Math.min(T.h, y + step);
			wp.set([x, lv, y, x, lv, y2, x2, lv, y, x2, lv, y, x, lv, y2, x2, lv, y2], o); o += 18;
		}
		const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
		r3.root.add(new THREE.Mesh(wg, new THREE.MeshBasicMaterial({ color: 0x2f6fd6, transparent: true, opacity: 0.55, side: THREE.DoubleSide })));
	}
	// 路(用导出结果展开，所见即所得)
	let out;
	try { out = ME.exportRoadnet(S.model, T).output; } catch (e) { out = null; }
	if (out) {
		const nodeById = new Map(out.nodes.map((n) => [n.id, n]));
		const buckets = {};
		const pillars = [];
		for (const road of out.roads) {
			const a = nodeById.get(road.from), b = nodeById.get(road.to);
			if (!a || !b) continue;
			const pts = [[a.x, a.z, a.y]].concat(road.controls.map((c) => [c[0], c[2], c[1]])).concat([[b.x, b.z, b.y]]);
			const width = road.lanes.reduce((s, v) => s + v, 0) * ME.LANE_WIDTH;
			const n = road.controls.length ? 12 : 1;
			const kind = road.kind;
			const bucket = buckets[kind] = buckets[kind] || { p: [], i: [] };
			const base = bucket.p.length / 3;
			let prev = null;
			for (let k = 0; k <= n; k++) {
				const p = bezier3(pts, k / n), q = bezier3(pts, Math.min(1, (k + 0.01) / n)), r = bezier3(pts, Math.max(0, (k - 0.01) / n));
				let tx = q[0] - r[0], tz = q[2] - r[2]; const tl = Math.hypot(tx, tz) || 1; tx /= tl; tz /= tl;
				const lx = -tz * width / 2, lz = tx * width / 2;
				const lift = 0.05;
				bucket.p.push(p[0] + lx, p[1] + lift, p[2] + lz, p[0] - lx, p[1] + lift, p[2] - lz);
				if (k > 0) { const i0 = base + (k - 1) * 2; bucket.i.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2); }
				if (kind === 'bridge' && (!prev || Math.hypot(p[0] - prev[0], p[2] - prev[2]) > 3)) { const th = T.sampleHeight(p[0], p[2]); if (p[1] - th > 0.05) pillars.push(p[0], th, p[2], p[0], p[1], p[2]); prev = p; }
			}
		}
		const KC = { ground: 0x40454d, hug: 0x5f7f4a, mouth: 0x7a4b9a, tunnel: 0xb46ae0, bridge: 0xe0962f };
		for (const kind in buckets) {
			const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(buckets[kind].p, 3)); bg.setIndex(buckets[kind].i); bg.computeVertexNormals();
			r3.root.add(new THREE.Mesh(bg, new THREE.MeshLambertMaterial({ color: KC[kind] || 0x555555, side: THREE.DoubleSide, transparent: kind === 'tunnel', opacity: kind === 'tunnel' ? 0.6 : 1 })));
		}
		if (pillars.length) { const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(pillars, 3)); r3.root.add(new THREE.LineSegments(pg, new THREE.LineBasicMaterial({ color: 0xaaaaaa }))); }
		// 地块
		for (const lot of out.lots) {
			const c = ME.insetCorners(lot.corners, lot.margin) || lot.corners; const p = [];
			for (const k of [0, 1, 2, 0, 2, 3]) p.push(c[k][0], 0.2, c[k][1]);
			const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
			r3.root.add(new THREE.Mesh(lg, new THREE.MeshBasicMaterial({ color: new THREE.Color(areaColor(lot.area)), transparent: true, opacity: 0.5, side: THREE.DoubleSide })));
		}
		// 预设：比地块高一点的同色薄片
		for (const lot of S.model.lots) {
			if (!lot.presets || !lot.presets.length) continue;
			const rep = ME.replayPresets(S.model, lot, getRoadPieces()); if (!rep) continue;
			rep.steps.forEach((st, i) => {
				if (!st.placed) return;
				const q = quadWorld(rep.frame, st.placed), p = [];
				for (const k of [0, 1, 2, 0, 2, 3]) p.push(q[k][0], 0.35, q[k][1]);
				const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
				r3.root.add(new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color: new THREE.Color(presetColor(lot.presets[i].modId)), side: THREE.DoubleSide })));
			});
		}
	}
	// 绿化区：三角化后铺在地形上方一点，顶点高度取该处地形高度；轮廓画成线。
	for (const gr of S.model.greens || []) {
		if (gr.pts.length < 3 || ME.ringSelfIntersects(gr.pts)) continue;
		const contour = gr.pts.map((p) => new THREE.Vector2(p[0], p[1]));
		const tris = THREE.ShapeUtils.triangulateShape(contour, []);
		const lift = 0.25, p = [];
		for (const tri of tris) for (const k of tri) { const q = gr.pts[k]; p.push(q[0], T.sampleHeight(q[0], q[1]) + lift, q[1]); }
		if (p.length) {
			const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
			r3.root.add(new THREE.Mesh(gg, new THREE.MeshBasicMaterial({ color: 0x3fae5a, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false })));
		}
		const lp = [];
		for (let i = 0; i < gr.pts.length; i++) {
			const a = gr.pts[i], b = gr.pts[(i + 1) % gr.pts.length];
			lp.push(a[0], T.sampleHeight(a[0], a[1]) + lift + 0.05, a[1], b[0], T.sampleHeight(b[0], b[1]) + lift + 0.05, b[1]);
		}
		const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
		r3.root.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x7ee08f })));
	}
	S.dirty3d = false;
}
function render3D() {
	if (!r3) return;
	let rebuilt = false;
	if (S.dirty3d) { build3D(); rebuilt = true; }
	const c = r3.cam;
	// 按需渲染：地形是100万格/200万三角形，相机、场景、画布尺寸都没变就不重画(以前每帧都全画一遍，空闲时也白烧显卡)。
	const key = [c.yaw, c.pitch, c.dist, c.target.x, c.target.y, c.target.z, r3.renderer.domElement.width, r3.renderer.domElement.height].join(',');
	if (!rebuilt && key === r3.lastKey) return;
	r3.lastKey = key;
	r3.camera.position.set(c.target.x + Math.sin(c.yaw) * Math.cos(c.pitch) * c.dist, c.target.y + Math.sin(c.pitch) * c.dist, c.target.z + Math.cos(c.yaw) * Math.cos(c.pitch) * c.dist);
	r3.camera.lookAt(c.target);
	r3.renderer.render(r3.scene, r3.camera);
}

// ======================= 主循环 =======================
function frame() {
	if (S.mode3d) render3D();
	else if (S.dirty2d) { draw2D(); S.dirty2d = false; }
	requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { resize2d(); resize3d(); });
window.addEventListener('beforeunload', (e) => { if (hist.undo.length) { e.preventDefault(); e.returnValue = ''; } });

resize2d(); rebuildTerrainImage(); fitView(); updateTop(); renderLeft(); renderRight(); updateStatus();
window.addEventListener('load', () => { resize2d(); fitView(); S.dirty2d = true; });
requestAnimationFrame(frame);
window.__S = S; // 调试用
</script>
