}

// ── File I/O ──────────────────────────────────────────────────────────────────

function newFile() {
  saveCurrentToEntry();
  const entry = makeBlankEntry(makeNewFileName());
  files.push(entry);
  applyEntry(files.length - 1);
}

function parseAndApply(text, name, handle = null) {
  try {
    let src = text.replace(/,(\s*[}\]])/g, '$1');  // strip trailing commas
    const parsed = JSON.parse(src);
    const entry = makeBlankEntry(name);
    entry.handle = handle;
    ALL_KEYS.forEach(k => { entry.data[k] = parsed[k] || []; });
    // Legacy (pre-migration) files stored the pedestrian layer under the bare
    // "navigation" key — accept it as a fallback alias so old files still load.
    const rawPedNav = parsed.pedestrianNavigation || parsed.navigation;
    entry.pedestrianNav = rawPedNav
      ? { nodes: rawPedNav.nodes || [], lines: rawPedNav.lines || [], connections: rawPedNav.connections || [] }
      : { nodes: [], lines: [], connections: [] };
    const rawVehNav = parsed.vehicleNavigation;
    entry.vehicleNav = rawVehNav
      ? { nodes: rawVehNav.nodes || [], lines: rawVehNav.lines || [], connections: rawVehNav.connections || [] }
      : { nodes: [], lines: [], connections: [] };
    entry.savedSnapshot = JSON.stringify({ data: entry.data, pedestrianNav: entry.pedestrianNav, vehicleNav: entry.vehicleNav });
    saveCurrentToEntry();
    files.push(entry);
    applyEntry(files.length - 1);
  } catch (err) { alert('解析失败: ' + err.message); }
}

async function loadFile() {
  if (window.showOpenFilePicker) {
    try {
      const handles = await window.showOpenFilePicker({
        types: [{ description: 'Layout', accept: { 'text/plain': ['.layout'] } }],
        startIn: files[activeFileIdx]?.handle || 'documents',
        multiple: true,
      });
      let lastIdx = -1;
      for (const handle of handles) {
        // Check if already open
        let existIdx = -1;
        for (let i = 0; i < files.length; i++) {
          if (files[i].handle && await files[i].handle.isSameEntry(handle)) { existIdx = i; break; }
        }
        if (existIdx >= 0) { lastIdx = existIdx; continue; }
        const file = await handle.getFile();
        parseAndApply(await file.text(), file.name, handle);
        lastIdx = files.length - 1;
      }
      if (lastIdx >= 0) switchToFile(lastIdx);
    } catch (err) { if (err.name !== 'AbortError') alert('加载失败: ' + err.message); }
  } else {
    document.getElementById('finput').click();
  }
}

async function onFileChosen(e) {
  const chosen = Array.from(e.target.files);
  e.target.value = '';
  if (!chosen.length) return;
  let lastIdx = -1;
  for (const file of chosen) {
    // Check if already open by name
    const existIdx = files.findIndex(f => f.name === file.name);
    if (existIdx >= 0) { lastIdx = existIdx; continue; }
    parseAndApply(await file.text(), file.name, null);
    lastIdx = files.length - 1;
  }
  if (lastIdx >= 0) switchToFile(lastIdx);
}

async function saveFileAs() {
  const content    = serializeLayout();
  const curEntry   = files[activeFileIdx];
  const fileName   = curEntry ? curEntry.name : 'untitled.layout';
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        startIn: curEntry?.handle || 'documents',
        types: [{ description: 'Layout', accept: { 'text/plain': ['.layout'] } }],
      });
      if (curEntry) { curEntry.handle = handle; curEntry.name = handle.name; curEntry.savedSnapshot = snapshotState(); }
      document.getElementById('fname').textContent = handle.name;
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      renderFileList();
    } catch (err) { if (err.name !== 'AbortError') alert('保存失败: ' + err.message); }
  } else {
    if (curEntry) curEntry.savedSnapshot = snapshotState();
    const anchor    = document.createElement('a');
    anchor.href     = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
    anchor.download = fileName;
    anchor.click();
    URL.revokeObjectURL(anchor.href);
    renderFileList();
  }
}

async function saveFile() {
  const content  = serializeLayout();
  const curEntry = files[activeFileIdx];
  const fileName = curEntry ? curEntry.name : 'untitled.layout';
  try {
    if (curEntry?.handle) {
      const writable = await curEntry.handle.createWritable();
      await writable.write(content);
      await writable.close();
      curEntry.savedSnapshot = snapshotState();
      renderFileList();
      return;
    }
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        startIn: curEntry?.handle || 'documents',
        types: [{ description: 'Layout', accept: { 'text/plain': ['.layout'] } }],
      });
      if (curEntry) { curEntry.handle = handle; curEntry.name = handle.name; curEntry.savedSnapshot = snapshotState(); }
      document.getElementById('fname').textContent = handle.name;
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      renderFileList();
    } else {
      if (curEntry) curEntry.savedSnapshot = snapshotState();
      const anchor    = document.createElement('a');
      anchor.href     = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
      anchor.download = fileName;
      anchor.click();
      URL.revokeObjectURL(anchor.href);
      renderFileList();
    }
  } catch (err) { if (err.name !== 'AbortError') alert('保存失败: ' + err.message); }
}

// ── Serializer ────────────────────────────────────────────────────────────────
// Reproduces the original .layout file style:
//   - Tab indentation
//   - Trailing comma after every value/entry
//   - 8-element (or any) pure-number arrays on a single line

function fmtNum(n) {
  if (Number.isInteger(n)) return String(n);
  return parseFloat(n.toPrecision(10)).toString();
}
function fmt8(arr) { return '[' + arr.map(fmtNum).join(', ') + ']'; }

function serializeLayout() {
  const lines       = ['{'];
  const presentKeys = ALL_KEYS.filter(k => S.data[k] && S.data[k].length > 0);

  presentKeys.forEach(key => {
    const elemArray = S.data[key];
    if (SIMPLE.has(key)) {
      lines.push(`\t"${key}": [`);
      elemArray.forEach(item => lines.push(`\t\t${fmt8(item)},`));
      lines.push(`\t],`);
    } else {
      const serializedItems = elemArray.map(obj => serializeObj(obj, '\t\t'));
      lines.push(`\t"${key}": [${serializedItems.join(',\n\t')}],`);
    }
  });

  // Pedestrian and vehicle navigation layers are always written, even when
  // empty, so downstream C++ parsing doesn't need to special-case a missing key.
  lines.push(`\t"pedestrianNavigation": ${serializeValue(S.pedestrianNav, '\t')},`);
  lines.push(`\t"vehicleNavigation": ${serializeValue(S.vehicleNav, '\t')}`);

  lines.push('}');
  return lines.join('\n');
}

function serializeObj(obj, indent) {
  let s = '{\n';
  if (obj.rect      !== undefined) s += `${indent}"rect": ${fmt8(obj.rect)},\n`;
  if (obj.direction !== undefined) s += `${indent}"direction": ${obj.direction},\n`;
  if (obj.walls && obj.walls.length > 0) s += `${indent}"walls": [${obj.walls.join(', ')}],\n`;
  if (obj.doors   && obj.doors.length   > 0) s += serializeOpenings(obj.doors,   'doors',   indent);
  if (obj.windows && obj.windows.length > 0) s += serializeOpenings(obj.windows, 'windows', indent);
  s += indent.slice(1) + '}';
  return s;
}

function serializeOpenings(openingList, fieldName, indent) {
  let s = `${indent}"${fieldName}": [\n`;
  openingList.forEach(entry => {
    s += `${indent}\t{\n`;
    s += `${indent}\t\t"direction": ${entry.direction},\n`;
    if (entry.positions && entry.positions.length > 0) {
      s += `${indent}\t\t"positions": [\n`;
      entry.positions.forEach(pos => { s += `${indent}\t\t\t${fmt8(pos)},\n`; });
      s += `${indent}\t\t],\n`;
    } else {
      s += `${indent}\t\t"positions": [],\n`;
    }
    s += `${indent}\t},\n`;
  });
  s += `${indent}],\n`;
  return s;
}

// Generic recursive serializer for the navigation objects and any future arbitrary fields.
// Pure-number arrays (e.g. 4-element point params) are always written on a single line.
function serializeValue(val, ind) {
  if (val === null || val === undefined) return 'null';
  if (typeof val === 'number')  return fmtNum(val);
  if (typeof val === 'string')  return JSON.stringify(val);
  if (typeof val === 'boolean') return String(val);
  if (Array.isArray(val)) {
    if (val.length === 0) return '[]';
    if (val.every(v => typeof v === 'number'))
      return '[' + val.map(fmtNum).join(', ') + ']';
    const ni = ind + '\t';
    const inner = val.map(v => ni + serializeValue(v, ni)).join(',\n') + ',';
    return '[\n' + inner + '\n' + ind + ']';
  }
  if (typeof val === 'object') {
    const keys = Object.keys(val);
    if (keys.length === 0) return '{}';
    const ni = ind + '\t';
    const inner = keys.map(k => ni + JSON.stringify(k) + ': ' + serializeValue(val[k], ni)).join(',\n') + ',';
    return '{\n' + inner + '\n' + ind + '}';
  }
  return String(val);
}

// ── Legend ────────────────────────────────────────────────────────────────────

function renderLegend() {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';

  if (isNavMode(S.mode)) {
    const navItems = [
      { color: NAV_CIRCLE_COLOR.node,      label: '独立节点' },
      { color: NAV_CIRCLE_COLOR.single,    label: '独立房间节点' },
      { color: NAV_CIRCLE_COLOR.row,       label: '联排房间节点' },
      { color: NAV_CIRCLE_COLOR.lineStart, label: '路径起点' },
      { color: NAV_CIRCLE_COLOR.lineEnd,   label: '路径终点' },
      { color: 'rgba(255,255,255,0.7)',     label: '层内连接' },
      { color: '#ff4444',                  label: '外部出口' },
      { color: '#44cc88',                  label: '上楼' },
      { color: '#4488ff',                  label: '下楼' },
    ];
    for (const { color, label } of navItems) {
      const itemEl = document.createElement('div');
      itemEl.className = 'legend-item';
      const swatch = document.createElement('div');
      swatch.className = 'legend-swatch';
      swatch.style.background = color;
      const nameLabel = document.createElement('span');
      nameLabel.textContent = label;
      itemEl.appendChild(swatch); itemEl.appendChild(nameLabel);
      legendEl.appendChild(itemEl);
    }
    return;
  }

  for (const type of MODE_TYPES[S.mode]) {
    const itemEl = document.createElement('div');
    itemEl.className = 'legend-item';
    const swatch = document.createElement('div');
    swatch.className = 'legend-swatch';
    swatch.style.background = COLORS[type];
    const nameLabel = document.createElement('span');
    nameLabel.textContent = TYPE_LABEL[type];
    itemEl.appendChild(swatch); itemEl.appendChild(nameLabel);
    legendEl.appendChild(itemEl);
  }
}

  redraw(); renderLegend(); renderPanel();
});

// Wheel scroll for global W/H inputs
['global-w', 'global-h'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('wheel', e => {
    if (document.activeElement !== el) return;
    e.preventDefault();
    const step = parseFloat(el.step) || 1;
    const newVal = Math.max(parseFloat(el.min) || 0, (parseFloat(el.value) || 0) + (e.deltaY < 0 ? step : -step));
    el.value = newVal;
  }, { passive: false });
});

renderFileList();  // starts with no files: hides canvas-wrap and panel
</script>
</body>
</html>
