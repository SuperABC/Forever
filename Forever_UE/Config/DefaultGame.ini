
[/Script/CommonUI.CommonUISettings]
CommonButtonAcceptKeyHandling=TriggerClick

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=0B9945B84B0498D89B16C1A0D81D2CBD

; Forever层大量代码按运行时字符串路径LoadObject/LoadClass加载资产(比如
; ForeverTerrainFrameworkComponent读/Game/Asset/Textures/Terrain/下的贴图，
; ForeverRoadnetFrameworkComponent读/Game/Asset/Meshes/下的路网/围栏网格，
; ForeverTrafficFrameworkComponent::GenerateVehicles读VehicleMod::blueprintPath
; (/Game/Blueprint/Vehicle/下的蓝图))，不是通过Blueprint/关卡的硬引用——cook默认只收集
; "被引用链路实际摸得到"的资产，这类纯字符串路径加载不在这条链路上，不显式声明就会在
; 打包产物里缺失(实测现象：LoadPackage: SkipPackage警告，PIE正常、打包后却找不到这些
; 贴图/网格/蓝图)。照抄老工程(E:\Projects\Forever_UE\Config\DefaultGame.ini)的
; DirectoriesToAlwaysCook解法，再补一条"/Game/Blueprint"(老工程没有Vehicle蓝图这个功能，
; 这次新增)。
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/3rdParty")
+DirectoriesToAlwaysCook=(Path="/Game/Asset")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprint")
+DirectoriesToAlwaysCook=(Path="/Water")
; pak.bat的BuildCookRun命令行带了-allmaps，但实测在这个引擎版本下cooker实际收到的命令行
; 根本没有任何地图相关参数(用UAT自己单独写的Cook-*.txt详细日志验证过，-allmaps没有被
; 转发进真正的cook子进程)——之前World.umap能被cook进去纯粹是因为它曾经是
; GameDefaultMap(默认地图会被自动纳入)，这次把GameDefaultMap改成Menu.Menu(给配置界面用)
; 之后，World.umap失去了这层"自动默认地图"保护，而它只被C++里硬编码字符串
; UGameplayStatics::OpenLevel("/Game/Levels/World.World")动态引用，cooker的静态引用
; 追踪根本发现不到，结果从打包产物里彻底消失——表现为点"开始游戏"后ClientTravelFailure
; (Failed to load package '/Game/Levels/World.World')，引擎自动回退到Menu关卡，看起来
; 像"什么都没发生"。和上面DirectoriesToAlwaysCook解决的是同一类问题(运行时字符串路径
; 加载不在cook的静态引用链路上)，但DirectoriesToAlwaysCook只对普通资产生效、对.umap地图
; 不起作用(试过加"/Game/Levels"进DirectoriesToAlwaysCook，cook详细日志里确认完全没有
; 处理过World.umap，Menu.umap依然是唯一被cook的地图)——地图必须用MapsToCook单独声明。
+MapsToCook=(FilePath="/Game/Levels/Menu")
+MapsToCook=(FilePath="/Game/Levels/World")
; mod自己的迷你UE工程(Forever_Mod/<Mod>/UE/<Mod>)用纯UnrealPak.exe -Create打出来的
; .pak是经典/legacy格式，不是IoStore容器(.ucas/.utoc)。UE5.7默认bUseIoStore=true，主
; 项目自己的内容走IoStore，LoadPackage优先经IoDispatcher解析——实测现象：
; FPackageName::DoesPackageExist对mod pak里的资产返回true(走的是legacy pak文件表查找
; 这条路)，但LoadObject/LoadPackage读同一个包仍然失败("package does not exist on disk
; or in the loader")，因为IoDispatcher那条主路径根本不知道这个legacy pak容器的存在。
; 关掉IoStore让主项目自己的打包产物也退回legacy pak格式，和mod pak用的是同一套机制，
; 两者才能互通——照抄老工程(E:\Projects\Forever_UE\Config\DefaultGame.ini)的这个设置，
; 之前排查打包流程时漏看了这一条，这次补上。
bUseIoStore=False
