<style>
  .demo { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius, 14px); padding: 16px; overflow: hidden; }
  .dstage { position: relative; display: grid; grid-template-columns: 1fr minmax(120px, 0.9fr) 1fr; gap: 10px; align-items: start; min-height: 300px; }
  .dside { text-align: center; position: relative; transition: transform .35s, opacity .6s, filter .6s; }
  .dside svg { width: 92px; height: 118px; display: block; margin: 0 auto 4px; }
  .dname { font-weight: 800; margin-bottom: 6px; }
  .dname.p { color: var(--blue); } .dname.e { color: #e0562e; }
  .dbars { display: grid; gap: 5px; text-align: left; font-size: 12.5px; }
  .dbar { display: grid; grid-template-columns: 36px 1fr 46px; gap: 6px; align-items: center; }
  .dbar .t { height: 12px; background: #00000040; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .dbar .f { height: 100%; width: 100%; transition: width .7s cubic-bezier(.2,.8,.2,1); border-radius: 6px; }
  .dbar .v { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .f.mp { background: #3c82dc; } .f.atk { background: #dcaf32; } .f.hp { background: #d23c3c; }   /* 和模拟器里三个状态条的顺序、颜色一致 */
  .dmeta { display: flex; justify-content: center; gap: 8px; margin-top: 8px; font-size: 13px; flex-wrap: wrap; }
  .dmeta span { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-variant-numeric: tabular-nums; }
  .dmeta .bomb { border-color: var(--gold); color: var(--gold); font-weight: 700; display: none; }
  .dmid { position: relative; padding-top: 28px; min-height: 240px; }
  .dpick { margin: 0 auto 12px; max-width: 190px; border-radius: 12px; padding: 7px 10px; font-size: 13px; line-height: 1.45; border: 2px dashed var(--line); color: var(--ink-soft); min-height: 56px; transition: opacity .3s, border-color .3s; text-align: center; }
  .dpick b { display: block; color: var(--ink); font-size: 14px; }
  .dpick.p.on { border-color: var(--blue); border-style: solid; }
  .dpick.e.on { border-color: #e0562e; border-style: solid; }
  .dfx { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .dfx .proj { position: absolute; width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 16px 4px currentColor; top: 64px; }
  .dfx .num { position: absolute; font-weight: 800; font-size: 20px; text-shadow: 0 2px 6px #000a; white-space: nowrap; transform: translateX(-50%); }
  .dfx .ring { position: absolute; border-radius: 50%; border: 6px solid var(--gold); box-shadow: 0 0 40px 10px #f0c86088; transform: translate(-50%, -50%); }
  .dfx .tag { position: absolute; transform: translateX(-50%); font-weight: 800; font-size: 18px; white-space: nowrap; text-shadow: 0 2px 6px #000a; }
  .shake { animation: dshake .45s; }
  @keyframes dshake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-9px);} 40% { transform: translateX(8px);} 60% { transform: translateX(-6px);} 80% { transform: translateX(4px);} }
  .dside.dead { opacity: .35; filter: grayscale(1); transform: rotate(-12deg) translateY(10px); }
  .dside.charge svg { filter: drop-shadow(0 0 10px var(--gold)); }
  .dnarr { margin-top: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-height: 108px; }
  .dnarr .rt { font-weight: 800; color: var(--gold); margin-bottom: 4px; }
  .dnarr .tx { line-height: 1.75; }
  .dctl { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .dctl button { font: inherit; cursor: pointer; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; }
  .dctl button:hover:not(:disabled) { border-color: var(--gold); }
  .dctl button:disabled { opacity: .4; cursor: default; }
  .dctl .main { background: var(--gold); color: #1b1608; border-color: var(--gold); font-weight: 800; min-width: 92px; }
  .ddots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .ddots i { width: 24px; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer; }
  .ddots i.done { background: #f0c86088; } .ddots i.cur { background: var(--gold); }
  @media (max-width: 640px) {
    .dstage { grid-template-columns: 1fr 1fr; }
    .dmid { grid-column: 1 / -1; grid-row: 2; padding-top: 6px; min-height: 150px; }
    .dpick { max-width: none; }
    .dfx .proj { top: 40px; }
  }
</style>

<section id="demo">
  <h2><span class="no">15</span>动画示范：一局从头看到尾</h2>
  <p class="lead">下面是一局最简单的 4-3 阶位对决（双方属性完全相同），一共 5 个回合。点 ▶ 自动播放，也可以用按钮一步一步看，每一步下面都有讲解。三个状态条和模拟器里一样：<b style="color:#3c82dc">MP</b> 真气（蓝）、<b style="color:#dcaf32">ATK</b> 武力（黄）、<b style="color:#d23c3c">HP</b> 健康（红）。</p>
  <div class="demo" id="demoBox">
    <div class="dstage" id="dStage">
      <div class="dside" id="dP">
        <svg viewBox="0 0 92 118" aria-hidden="true"><circle cx="46" cy="22" r="17" fill="#f0cfa8"/><path d="M22 112 V62 a12 12 0 0 1 12-12 h24 a12 12 0 0 1 12 12 v50 z" fill="#3a7be0"/><path d="M70 66 L86 52" stroke="#f0cfa8" stroke-width="9" stroke-linecap="round"/><circle cx="90" cy="49" r="7" fill="#4a8ff0"/></svg>
        <div class="dname p">你</div>
        <div class="dbars" id="barsP"></div>
        <div class="dmeta"><span class="agi"></span><span class="bomb"></span></div>
      </div>
      <div class="dmid">
        <div class="dpick p" id="pickP">你的选择</div>
        <div class="dpick e" id="pickE">对手的选择</div>
        <div class="dfx" id="dFx"></div>
      </div>
      <div class="dside" id="dE">
        <svg viewBox="0 0 92 118" aria-hidden="true"><circle cx="46" cy="22" r="17" fill="#f0cfa8"/><path d="M70 112 V62 a12 12 0 0 0 -12-12 h-24 a12 12 0 0 0 -12 12 v50 z" fill="#e0562e"/><path d="M22 66 L6 52" stroke="#f0cfa8" stroke-width="9" stroke-linecap="round"/><circle cx="2" cy="49" r="7" fill="#e0562e"/></svg>
        <div class="dname e">对手</div>
        <div class="dbars" id="barsE"></div>
        <div class="dmeta"><span class="agi"></span><span class="bomb"></span></div>
      </div>
    </div>
    <div class="dnarr"><div class="rt" id="dTitle"></div><div class="tx" id="dText"></div></div>
    <div class="dctl">
      <button id="dPrev" title="上一步">◀ 上一步</button>
      <button id="dPlay" class="main">▶ 播放</button>
      <button id="dNext" title="下一步">下一步 ▶</button>
      <button id="dRestart" title="回到开头">↺ 重来</button>
    </div>
    <div class="ddots" id="dDots"></div>
  </div>
  <p style="color:var(--ink-soft);font-size:14px;margin-top:10px">说明：示范里的闪避结果是事先定好的（第 2 回合闪开、第 3~4 回合没闪开），真实对局里是按概率随机的。数字都是按游戏规则算出来的。</p>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MAX = { hp: 5840, atk: 8710, mp: 6250 }, AGIMAX = 8;
  var S = function (hp, atk, mp, agi, bomb) { return { hp: hp, atk: atk, mp: mp, agi: agi, bomb: bomb }; };
  var GRAY = '#9a9aaa', METAL = '#c9c9d6', GOLD = '#f0c860', RED = '#e24b4b';
  // 状态按"4-3 阶位、第十二式招式"用游戏的战斗规则逐回合算出来
  var ST = [
    [S(5840,8710,6250,8,0), S(5840,8710,6250,8,0)],
    [S(5840,7928,5505,8,0), S(5840,8710,5452,8,0)],
    [S(5840,7928,5661,8,0), S(5840,8710,5608,8,0)],
    [S(5840,7928,5661,7,0), S(5840,8710,4863,8,0)],
    [S(5840,7928,5817,7.2,0), S(5840,8710,5019,8,0)],
    [S(5840,6028,4654,7.2,6512), S(5840,8710,4274,8,0)],
    [S(5840,6028,4810,7.4,6512), S(5840,8710,4430,8,0)],
    [S(5840,4296,3848,7.4,11899), S(5840,8710,3632,8,0)],
    [S(5840,4296,4004,7.6,11899), S(5840,8710,3788,8,0)],
    [S(3461,4296,4004,7.6,0), S(0,8710,2990,8,0)]
  ];
  var WU = ['无招第十二式', '无属性 · 消耗 745 · 威力 1900', GRAY], TIE = ['铁手功第十二式', '金属性 · 消耗 798 · 威力 1732', METAL];
  var F = [
    { t: '开场', s: 0, picks: null, x: '这是一场 4-3 阶位的对决，双方属性完全一样：健康 5840、武力 8710、真气 6250、敏捷 8。左边蓝色是你，右边红色是对手。谁先把对方的<b>健康</b>或<b>武力</b>打到 0，谁就赢。' },
    { t: '第 1 回合 · 选招', s: 0, picks: [WU, TIE],
      x: '双方同时选招。你出<b>无招第十二式</b>（无属性，威力 1900），对手出<b>铁手功第十二式</b>（金属性，威力 1732）。' },
    { t: '第 1 回合 · 结算', s: 1, fx: 'r1', x: '两招在中间<b>对撞</b>。金属性<b>克制</b>无属性，你的威力减半：1900 → 950。对手的 1732 更大，于是对手打出<b>差额 782</b>：你的武力 −782（8710 → 7928）。双方各花掉 745、798 真气。' },
    { t: '第 2 回合 · 选招', s: 2, picks: [['跳过', '什么都不出', null], WU],
      x: '你预感对手还会进攻，选了<b>跳过</b>：这回合你不出招，但敏捷<b>翻倍</b>（8 → 16）。对手出<b>无招第十二式</b>。' },
    { t: '第 2 回合 · 结算', s: 3, fx: 'r2', x: '你没有出招，对手的攻击没有被抵消，本来要全额打在你身上——但你的敏捷是对手的 2 倍，闪避概率 = 16² ÷ (16² + 8²) = <b>80%</b>。这次<b>闪开了</b>！代价是敏捷 −1（8 → 7）；对手白白花了 745 真气。' },
    { t: '第 3 回合 · 选招', s: 4, picks: [['积攒真气炸弹', '消耗当前真气的 20%，按 ×5.6 存成炸弹', GOLD], WU],
      x: '你决定放个大招：<b>积攒真气炸弹</b>。消耗当前真气的 20%（5817 × 20% = 1163），按这个阶位的倍率 5.6 存起来，得到 <b>6512</b> 点炸弹能量。这回合你不出招；对手继续出无招。' },
    { t: '第 3 回合 · 结算', s: 5, fx: 'r3', x: '你只能用自己的敏捷（7.2）去躲，对手敏捷 8，闪避概率只有 7.2² ÷ (7.2² + 8²) ≈ <b>45%</b>，这次没躲开：武力 −1900（7928 → 6028）。炸弹能量 <b>6512</b> 已经存好。' },
    { t: '第 4 回合 · 选招', s: 6, picks: [['积攒真气炸弹', '真气 4810 的 20% = 962，×5.6 ≈ 5387', GOLD], TIE],
      x: '再<b>积攒</b>一次：4810 × 20% = 962，×5.6 ≈ 5387，炸弹累计到 <b>11899</b>。对手这回合换成铁手功。' },
    { t: '第 4 回合 · 结算', s: 7, fx: 'r4', x: '闪避概率约 46%，又没躲开：武力 −1732（6028 → 4296）。你的武力在慢慢流失，但炸弹已经攒到 11899，足够一击打死对手了。' },
    { t: '第 5 回合 · 选招', s: 8, picks: [['释放真气炸弹', '炸弹能量 11899', GOLD], TIE],
      x: '时机到了：<b>释放真气炸弹</b>！对手这回合出的是铁手功（威力 1732）。' },
    { t: '第 5 回合 · 结算', s: 9, fx: 'r5', end: true, x: '对手出了招，炸弹伤害 = (11899 − 1732) × 0.8 ≈ <b>8133</b>，超过他的健康 5840，<b>对手倒下，你赢了</b>！代价是你自己也受到炸弹 × 0.2 ≈ <b>2379</b> 的反噬，健康 5840 → 3461。<br>' +
      '<span style="color:var(--ink-soft)">注意：对手如果在这回合选了「跳过」或「积攒」，炸弹只会打出 11899 × 0.4 ≈ 4759，杀不死他；而你仍要承受 2379 的反噬。炸弹是高风险高回报的赌注。</span>' }
  ];

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = 0, timer = null, playing = false;
  var side = { p: { root: $('dP'), bars: $('barsP') }, e: { root: $('dE'), bars: $('barsE') } };
  [side.p, side.e].forEach(function (o) {
    o.bars.innerHTML = [['mp', 'MP'], ['atk', 'ATK'], ['hp', 'HP']].map(function (r) {
      return '<div class="dbar" data-k="' + r[0] + '"><span>' + r[1] + '</span><div class="t"><div class="f ' + r[0] + '"></div></div><span class="v"></span></div>';
    }).join('');
    o.agi = o.root.querySelector('.agi'); o.bomb = o.root.querySelector('.bomb');
  });

  function setState(o, st) {
    ['hp', 'atk', 'mp'].forEach(function (k) {
      var row = o.bars.querySelector('[data-k="' + k + '"]');
      row.querySelector('.f').style.width = Math.max(0, Math.min(100, 100 * st[k] / MAX[k])) + '%';
      row.querySelector('.v').textContent = st[k];
    });
    o.agi.textContent = '敏捷 ' + (Math.round(st.agi * 100) / 100) + ' / ' + AGIMAX;
    o.bomb.style.display = st.bomb > 0 ? 'inline-block' : 'none';
    o.bomb.textContent = '💣 炸弹 ' + st.bomb;
    o.root.classList.toggle('charge', st.bomb > 0);
    o.root.classList.toggle('dead', st.hp <= 0);
  }
  function setPick(el, p) {
    if (!p) { el.className = el.className.replace(' on', ''); el.innerHTML = el.id === 'pickP' ? '你的选择' : '对手的选择'; return; }
    if (el.className.indexOf(' on') < 0) el.className += ' on';
    el.innerHTML = '<b>' + p[0] + '</b>' + p[1];
  }

  // ---- 动画 ----
  var fx = $('dFx');
  function clearFx() { fx.innerHTML = ''; }
  function box(el) { var a = fx.getBoundingClientRect(), b = el.getBoundingClientRect(); return { x: b.left - a.left + b.width / 2, y: b.top - a.top, w: b.width, h: b.height }; }
  function anim(el, kf, opt) { if (reduce || !el.animate) return null; return el.animate(kf, opt); }
  function proj(fromP, color, delay, dur) {
    var d = document.createElement('div'); d.className = 'proj'; d.style.color = color; d.style.background = color;
    var w = fx.clientWidth - 26; d.style.left = (fromP ? 0 : w) + 'px'; d.style.opacity = 0; fx.appendChild(d);
    var a = anim(d, [{ left: (fromP ? 0 : w) + 'px', opacity: 1 }, { left: (fromP ? w : 0) + 'px', opacity: 1 }], { duration: dur || 900, delay: delay || 0, fill: 'both', easing: 'ease-in' });
    if (!a) d.remove(); else a.onfinish = function () { d.style.opacity = 0; };
    return d;
  }
  function projTo(fromP, color, delay, stopFrac) {  // 只飞一部分
    var d = document.createElement('div'); d.className = 'proj'; d.style.color = color; d.style.background = color; d.style.opacity = 0;
    var w = fx.clientWidth - 26, end = fromP ? w * stopFrac : w * (1 - stopFrac);
    d.style.left = (fromP ? 0 : w) + 'px'; fx.appendChild(d);
    var a = anim(d, [{ left: (fromP ? 0 : w) + 'px', opacity: 1 }, { left: end + 'px', opacity: 1 }, { left: end + 'px', opacity: 0 }], { duration: 900, delay: delay || 0, fill: 'both', easing: 'ease-in', offset: [0, 0.8, 1] });
    if (!a) d.remove();
  }
  function num(isP, text, color, delay) {
    var host = isP ? side.p.root : side.e.root, d = document.createElement('div'); d.className = 'num'; d.textContent = text; d.style.color = color;
    var b = box(host); d.style.left = b.x + 'px'; d.style.top = (b.y + 20) + 'px'; d.style.opacity = 0; fx.appendChild(d);
    var a = anim(d, [{ opacity: 0, transform: 'translate(-50%, 10px)' }, { opacity: 1, transform: 'translate(-50%, -6px)', offset: .2 }, { opacity: 1, transform: 'translate(-50%, -30px)', offset: .8 }, { opacity: 0, transform: 'translate(-50%, -44px)' }], { duration: 1700, delay: delay || 0, fill: 'both' });
    if (!a) { d.style.opacity = 1; d.style.transform = 'translate(-50%, -20px)'; }
  }
  function shake(isP, delay) { var el = isP ? side.p.root : side.e.root; setTimeout(function () { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }, delay); }
  function sidestep(isP, delay) { var el = isP ? side.p.root : side.e.root; if (reduce) return; setTimeout(function () { var a = el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (isP ? -34 : 34) + 'px)' }, { transform: 'translateX(0)' }], { duration: 700 }); }, delay); }
  function ring(isP, delay, big) {
    var host = isP ? side.p.root : side.e.root, d = document.createElement('div'); d.className = 'ring'; var b = box(host);
    d.style.left = b.x + 'px'; d.style.top = (b.y + 60) + 'px'; d.style.width = d.style.height = '20px'; d.style.opacity = 0; fx.appendChild(d);
    anim(d, [{ opacity: .95, width: '20px', height: '20px' }, { opacity: 0, width: (big ? 260 : 140) + 'px', height: (big ? 260 : 140) + 'px' }], { duration: 900, delay: delay, fill: 'both' });
  }
  function tag(isP, text, color, delay) {
    var host = isP ? side.p.root : side.e.root, d = document.createElement('div'); d.className = 'tag'; d.textContent = text; d.style.color = color;
    var b = box(host); d.style.left = b.x + 'px'; d.style.top = (b.y - 4) + 'px'; d.style.opacity = 0; fx.appendChild(d);
    var a = anim(d, [{ opacity: 0, transform: 'translate(-50%, 8px) scale(.8)' }, { opacity: 1, transform: 'translate(-50%, -10px) scale(1.1)', offset: .25 }, { opacity: 1, transform: 'translate(-50%, -14px) scale(1)', offset: .8 }, { opacity: 0, transform: 'translate(-50%, -22px)' }], { duration: 1800, delay: delay, fill: 'both' });
    if (!a) { d.style.opacity = 1; }
  }
  var FX = {
    r1: function () { proj(true, GRAY, 0, 900); proj(false, METAL, 0, 900); tag(true, '金克无属性：威力 1900 → 950', METAL, 500); proj(false, METAL, 950, 600); num(true, '−782 武力', '#dcaf32', 1500); shake(true, 1500); },
    r2: function () { proj(false, GRAY, 0, 1000); tag(true, '敏捷翻倍！', '#4a8ff0', 0); sidestep(true, 900); tag(true, '闪避成功！', '#3fa653', 900); num(true, '敏捷 −1', '#a9a9bd', 1500); },
    r3: function () { ring(true, 0, false); num(true, '+6512 炸弹', GOLD, 100); proj(false, GRAY, 400, 900); num(true, '−1900 武力', '#dcaf32', 1300); shake(true, 1300); },
    r4: function () { ring(true, 0, false); num(true, '+5387 → 11899', GOLD, 100); proj(false, METAL, 400, 900); num(true, '−1732 武力', '#dcaf32', 1300); shake(true, 1300); },
    r5: function () { proj(false, METAL, 0, 700); ring(false, 500, true); ring(false, 700, true); tag(false, '炸弹命中！', GOLD, 500); num(false, '−8133 健康', RED, 1000); shake(false, 700); num(true, '−2379 健康', RED, 1300); shake(true, 1300); }
  };

  // ---- 渲染 ----
  function render(i, withFx) {
    cur = Math.max(0, Math.min(F.length - 1, i));
    var f = F[cur], st = ST[f.s];
    $('dTitle').textContent = f.t; $('dText').innerHTML = f.x;
    setPick($('pickP'), f.picks ? f.picks[0] : null); setPick($('pickE'), f.picks ? f.picks[1] : null);
    clearFx();
    if (f.fx && withFx) {
      // 先把状态设成动画开始之前(上一帧)，再延迟更新条形，让条形变化跟着动画走
      var prev = ST[F[cur - 1].s];
      setState(side.p, prev[0]); setState(side.e, prev[1]);
      FX[f.fx]();
      setTimeout(function () { if (F[cur] === f) { setState(side.p, st[0]); setState(side.e, st[1]); } }, reduce ? 0 : 1200);
    } else { setState(side.p, st[0]); setState(side.e, st[1]); }
    $('dPrev').disabled = cur === 0; $('dNext').disabled = cur === F.length - 1;
    var dots = $('dDots').children; for (var k = 0; k < dots.length; k++) dots[k].className = k < cur ? 'done' : (k === cur ? 'cur' : '');
    if (cur === F.length - 1) stop(true);
  }
  function dwell() { var f = F[cur]; return (f.fx ? 5600 : 4200) + (f.x.length > 90 ? 800 : 0); }
  function tick() { if (!playing) return; if (cur >= F.length - 1) { stop(true); return; } render(cur + 1, true); timer = setTimeout(tick, dwell()); }
  function play() {
    if (cur >= F.length - 1) render(0, false);
    playing = true; $('dPlay').textContent = '⏸ 暂停'; clearTimeout(timer); timer = setTimeout(tick, cur === 0 ? 1200 : dwell());
  }
  function stop(done) { playing = false; clearTimeout(timer); $('dPlay').textContent = done && cur >= F.length - 1 ? '↺ 重播' : '▶ 播放'; }

  $('dPlay').onclick = function () { if (playing) stop(false); else play(); };
  $('dNext').onclick = function () { stop(false); render(cur + 1, true); };
  $('dPrev').onclick = function () { stop(false); render(cur - 1, false); };
  $('dRestart').onclick = function () { stop(false); render(0, false); $('dPlay').textContent = '▶ 播放'; };
  $('dDots').innerHTML = F.map(function (f, i) { return '<i title="' + f.t + '" data-i="' + i + '"></i>'; }).join('');
  $('dDots').onclick = function (e) { var i = e.target.getAttribute && e.target.getAttribute('data-i'); if (i !== null && i !== undefined) { stop(false); render(+i, false); } };
  render(0, false);
  // 滚到这一节才自动开始一次
  if ('IntersectionObserver' in window) {
    var started = false;
    new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting && !started && cur === 0) { started = true; play(); } }); }, { threshold: 0.6 }).observe($('demoBox'));
  }
})();
</script>
