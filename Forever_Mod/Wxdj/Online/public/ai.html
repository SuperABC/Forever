  for (const ch of s) {
    if (ch === "十") { total += (cur === 0 ? 1 : cur) * 10; cur = 0; }
    else { const d = CN_DIGITS.indexOf(ch); if (d >= 0) cur = d + 1; }
  }
  return total + cur;
}

/* ---- 效果 ---- */
function ratioEffect(type, r) {
  const ratios = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 0; i < 7; i++) if (r[i] > 0) ratios[i] = r[i];
  return { type, ratios };
}
function physicalAll() { return { type: E_PHYSICAL, ratios: [1, 1, 1, 1, 1, 1, 1] }; }
function timedEffect(type, instant, continuous = 0, rounds = 0, interval = 1) {
  return { type, instant, continuous, rounds, interval, needHit: type === E_DOT, currentRound: 0 };
}
function lockEffect(prob) { return { type: E_LOCK, prob, keep: true }; }
function envEffect(type) { return { type, total: 3, currentRound: 0 }; }
function cloneEffect(e) { return Object.assign({}, e, e.ratios ? { ratios: e.ratios.slice() } : {}); }
function ratioOf(e, attr) { return e.ratios[attr] || 0; }
function timedOnce(e) {
  e.currentRound++;
  if (e.currentRound >= e.interval && e.rounds > 0) { e.rounds--; e.currentRound = 0; return e.continuous; }
  return 0;
}
const timedUsedUp = e => e.rounds <= 0;

function parseEffect(line) {
  const t = line.trim().split(/\s+/);
  const kind = t[0];
  const nums = t.slice(1).map(Number);
  const has = n => nums.length >= n && nums.slice(0, n).every(x => !Number.isNaN(x));
  switch (kind) {
    case "physical": return has(7) ? ratioEffect(E_PHYSICAL, nums) : physicalAll();
    case "penetrate": return has(7) ? ratioEffect(E_PENETRATE, nums) : null;
    case "reduce": return has(7) ? ratioEffect(E_REDUCE, nums) : null;
    case "rebound": return has(7) ? ratioEffect(E_REBOUND, nums) : null;
    case "absorb": return has(7) ? ratioEffect(E_ABSORB, nums) : null;
    case "lock": return has(1) ? lockEffect(nums[0]) : null;
    case "dot": case "rebate": case "recover": case "cure": {
      // 和原版解析一致：必须给全4个数(instant continuous rounds interval)
      if (!has(4)) return null;
      const type = { dot: E_DOT, rebate: E_REBATE, recover: E_RECOVER, cure: E_CURE }[kind];
      return timedEffect(type, nums[0] | 0, nums[1] | 0, nums[2] | 0, nums[3] | 0);
    }
    case "static": return has(1) ? { type: E_STATIC, ratio: Math.fround(nums[0]) } : null;   // 对静止敌人的增伤比例(float和C++一致)
    case "increase": return has(1) ? { type: E_INCREASE, ratio: Math.fround(nums[0]) } : null;   // 和C++的float一致
    case "shield": return has(2) ? { type: E_SHIELD, ratio: Math.fround(nums[0]), strength: 0, initial: 0, rounds: nums[1] | 0 } : null;   // 盾量=出招者武力上限x比例，出招时才算(float运算和C++一致)
  }
  return null;
}

/* ---- 特性(外部效果)：照 battle/modifier.h/.cpp 逐段移植，规则和数值公式见 battle.md 的"特性系统" ----
 * 一条特性 = {kind, value, percent, attrMask, duration, timing, cond, source}；同种类的数值取加和，持续时间各算各的。
 * 解析的文本格式：  mod <种类> <数值>[%] [attr=none,metal,wood,water,fire,earth,all|elements] [cond=hp<50] [dur=3] [timing=end] [src=名字] */
const MOD_KINDS = ["mp_round", "atk_round", "hp_round", "skip_agi", "agi_recover", "agi_max", "mp_max", "acc_ratio", "bomb_power",
  "base_power", "dmg_dealt", "dmg_taken", "field_mult", "crit_rate", "crit_dmg", "dodge", "hit", "cost",
  "deal_mp", "deal_atk", "deal_hp", "take_mp", "take_atk", "take_hp", "rebound", "immune",
  "now_mp", "now_atk", "now_hp", "now_agi", "now_field", "clear_field", "unlock", "now_shield", "resist", "elem_power"];
const MOD_ATTR_ALL = 0x7F;
const MOD_STATS = { hp: 1, atk: 2, mp: 3, agi: 4 };
function parseModAttrs(text) {
  let mask = 0;
  for (const item of text.split(",")) {
    if (item in ATTR_PARSE) mask |= 1 << ATTR_PARSE[item];
    else if (item === "elements") mask |= (1 << METAL) | (1 << WOOD) | (1 << WATER) | (1 << FIRE) | (1 << EARTH);
    else if (item === "any") mask |= MOD_ATTR_ALL;
    else return 0;
  }
  return mask;
}
function parseModifier(line) {
  const t = line.trim().split(/\s+/).filter(Boolean);
  let k = 0;
  if (t[k] === "mod") k++;
  if (k >= t.length || MOD_KINDS.indexOf(t[k]) < 0) return null;
  const m = { kind: t[k++], value: 0, percent: false, attrMask: MOD_ATTR_ALL, duration: -1, timing: 0, cond: { stat: 0, less: true, pct: 0 }, source: "" };
  let pending = null;
  if (k >= t.length) return (m.kind === "clear_field" || m.kind === "unlock") ? m : null;
  if (m.kind === "clear_field" || m.kind === "unlock") pending = t[k++];   // 数值被忽略，后面当参数继续解析
  else {
    let v = t[k++];
    if (v.endsWith("%")) { m.percent = true; v = v.slice(0, -1); }
    if (v === "" || Number.isNaN(Number(v))) return null;
    m.value = Number(v);
    if (m.kind === "dmg_taken" && m.value < 0) return null;   // 易伤只增不减：减伤只来自减伤效果
  }
  const handle = tok => {
    if (tok === "%") { m.percent = true; return true; }
    if (tok.startsWith("attr=")) { m.attrMask = parseModAttrs(tok.slice(5)); return m.attrMask !== 0; }
    if (tok.startsWith("dur=")) { m.duration = parseInt(tok.slice(4)) || 0; return m.duration !== 0; }
    if (tok.startsWith("timing=")) { const v = tok.slice(7); if (v === "start") m.timing = 0; else if (v === "end") m.timing = 1; else return false; return true; }
    if (tok.startsWith("src=")) { m.source = tok.slice(4); return true; }
    if (tok.startsWith("cond=")) {
      const v = tok.slice(5), pos = v.search(/[<>]/);
      if (pos <= 0) return false;
      const stat = MOD_STATS[v.slice(0, pos)];
      if (!stat) return false;
      m.cond = { stat, less: v[pos] === "<", pct: parseFloat(v.slice(pos + 1)) || 0 };
      return true;
    }
    return false;
  };
  if (pending !== null && !handle(pending)) return null;
  for (; k < t.length; k++) if (!handle(t[k])) return null;
  return m;
}

/* ---- 招式 ---- */
function makeAction(type, attr, point, power, effects, text) { return { type, attr, point, power, basePower: power, effects, text }; }   // basePower：招式表里的威力；power：本回合有效威力(连招增伤/炸弹能量)
const skipAction = () => makeAction(A_SKIP, NONE, 0, 0, [], "无");
const accumulateAction = () => makeAction(A_ACCUMULATE, NONE, 0, 0, [], "积攒真气炸弹");
const bombAction = () => makeAction(A_BOMB, NONE, 0, 0, [physicalAll()], "释放真气炸弹");
function singleFromDef(def) {
  const a = makeAction(A_SINGLE, def.attr, def.point, def.power, def.effects.map(cloneEffect), def.name);
  a.name = def.name;
  return a;
}
function dualAction(a1, a2) {
  const attr = DUAL_PRIMARY[a1.attr + "," + a2.attr];
  const a = makeAction(A_DUAL, attr,
    Math.trunc(DUAL_COST_FACTOR * (a1.point + a2.point)), Math.trunc(DUAL_POWER_FACTOR * (a1.power + a2.power)),
    a1.effects.filter(e => e.type !== E_INCREASE && e.type !== E_STATIC).concat(a2.effects.filter(e => e.type !== E_INCREASE && e.type !== E_STATIC && !a1.effects.some(o => o.type === e.type))),   // 同名效果只取第一个招式的；increase不并进双招(两个基础招式各自带自己的连招增伤)
    "(" + a1.name + ", " + a2.name + ")");
  a.action1 = a1; a.action2 = a2;
  return a;
}
function getEffect(action, type) { return action.effects.find(e => e.type === type) || null; }

// 双招的两招必须同式：招式名是"家族名+第X式"，比较"第X式"部分
function sameForm(a, b) {
  const p1 = a.name.indexOf("第"), p2 = b.name.indexOf("第");
  if (p1 < 0 || p2 < 0) return true;
  return a.name.slice(p1) === b.name.slice(p2);
}

function parseActions(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const defs = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line === "" || line[0] === "#") continue;
    const t = line.trim().split(/\s+/);
    if (t.length < 6) continue;
    const mp = parseInt(t[2]), atk = parseInt(t[3]), count = parseInt(t[5]);
    if ([mp, atk, count].some(Number.isNaN)) continue;
    const effects = [];
    for (let k = 0; k < count; k++) {
      i++;
      if (i >= lines.length) break;
      const e = parseEffect(lines[i]);
      if (e) effects.push(e);
    }
    defs.push({ name: t[0], attr: ATTR_PARSE[t[1]] ?? NONE, point: mp, power: atk, realm: t[4], effects });
  }
  return defs;
}

/* ---- 修炼者 ---- */
class Cultivator {
  constructor(name, defs, hp, atk, mp, agi, recover, agiLoss = 1, agiRecover = 0.2, bombMultiplier = BOMB_ACCUMULATE_MULTIPLIER) {
    this.name = name; this.defs = defs;
    this.maxHP = this.currentHP = hp; this.maxATK = this.currentATK = atk; this.maxMP = this.currentMP = mp;
    // 敏捷：当前值agi，上限maxAgi；闪避一次损失agiLoss，每回合自动恢复agiRecover(不超过上限)
    this.agi = agi; this.maxAgi = agi; this.agiLoss = agiLoss; this.agiRecover = agiRecover; this.skipStreak = 0; this.chain = []; this.mods = [];   // mods：特性
    this.recover = recover; this.bomb = 0; this.bombMultiplier = bombMultiplier;   // 炸弹积攒倍率：个人属性，由所在阶位决定
    this.elements = 0;   // 五行属性掩码，0=无属性
  }
  setElements(mask) { this.elements = mask & ELEMENT_ALL_MASK; }
  hasElement(attr) { return elementCovers(this.elements, attr); }
  // 对attr属性伤害的抗性(100%=1.0)：拥有的属性基础1.5，否则1.0，加上特性的增减，夹到>=0；五行=五个都拥有才算，取五个的平均值，否则1.0
  resist(attr) {
    if (attr === NONE) return 1.0;
    const one = a => {
      let x = (this.elements & elementBit(a)) ? ELEM_RESIST_OWNED : 1.0;
      if (this.mods.length) x += this.modSum("resist", a);
      return Math.max(0, x);
    };
    if (attr === ALL) {
      if (!elementCovers(this.elements, ALL)) return 1.0;
      let total = 0;
      for (let a = METAL; a <= EARTH; a++) total += one(a);
      return total / 5.0;
    }
    return one(attr);
  }
  // 自己拥有的属性的招式的威力倍率：基础1.5加特性的增减，夹到>=0
  elemPowerMul(attr) { return Math.max(0, ELEM_POWER_BASE + (this.mods.length ? this.modSum("elem_power", attr) : 0)); }
  // 连招链(increase用)：上一回合出的招(单招=1个，双招=2个基础招式)的[家族,式号,已连续步数]；本回合出家族F的第k式，链里有(F,k-1)就是步数+1，否则0
  peekChain(family, form) {
    if (form <= 1) return 0;
    const e = this.chain.find(x => x.family === family && x.form === form - 1);
    return e ? e.len + 1 : 0;
  }
  commitChain(moves) { this.chain = moves.map(m => ({ family: m[0], form: m[1], len: this.peekChain(m[0], m[1]) })); }
  resetChain() { this.chain = []; }
  // ---- 特性 ----
  condHolds(cond) {
    if (!cond || cond.stat === 0) return true;
    let cur = 0, max = 1;
    if (cond.stat === 1) { cur = this.currentHP; max = this.maxHP; }
    else if (cond.stat === 2) { cur = this.currentATK; max = this.maxATK; }
    else if (cond.stat === 3) { cur = this.currentMP; max = this.maxMP; }
    else { cur = this.agi; max = this.maxAgi; }
    if (max <= 0) max = 1;
    const pct = cur / max * 100;
    return cond.less ? pct < cond.pct : pct > cond.pct;
  }
  modSum(kind, attr) {
    let total = 0;
    for (const m of this.mods) if (m.kind === kind && (m.attrMask & (1 << attr)) && this.condHolds(m.cond)) total += m.value;
    return total;
  }
  modAny(kind, attr) { return this.mods.some(m => m.kind === kind && (m.attrMask & (1 << attr)) && this.condHolds(m.cond)); }
  scaledSum(kind, base) {   // percent的按base*value/100，否则直接加(忽略属性掩码)
    let total = 0;
    for (const m of this.mods) if (m.kind === kind && this.condHolds(m.cond)) total += m.percent ? base * m.value / 100 : m.value;
    return total;
  }
  getMaxMP() {   // 有效真气上限(含特性)；maxMP是基础上限
    if (!this.mods.length) return this.maxMP;
    const adj = this.scaledSum("mp_max", this.maxMP);
    return adj === 0 ? this.maxMP : Math.max(1, Math.trunc(this.maxMP + adj));
  }
  getMaxAgi() {
    if (!this.mods.length) return this.maxAgi;
    const adj = this.scaledSum("agi_max", this.maxAgi);
    return adj === 0 ? this.maxAgi : Math.max(1, Math.fround(this.maxAgi + adj));
  }
  adjustMP(delta) { if (delta > 0) this.recoverMP(delta); else if (delta < 0) this.currentMP = Math.max(0, this.currentMP + delta); }
  adjustATK(delta) { if (delta > 0) this.recoverATK(delta); else if (delta < 0) this.currentATK += delta; }
  adjustHP(delta) { if (delta > 0) this.recoverHP(delta); else if (delta < 0) this.currentHP = Math.max(0, this.currentHP + delta); }
  adjustAgi(delta) { this.agi = Math.max(1, Math.min(this.getMaxAgi(), this.agi + delta)); }
  tickMods() { for (const m of this.mods) if (m.duration > 0) m.duration--; this.mods = this.mods.filter(m => m.duration !== 0); }
  skipLoss() {   // 这次跳过要扣多少敏捷
    let loss = this.agiLoss + SKIP_STREAK_EXTRA_LOSS * this.skipStreak;
    if (this.mods.length) { const adj = this.scaledSum("skip_agi", 0); if (adj !== 0) loss = Math.max(0, loss + adj); }
    return loss;
  }
  canDodge() { return this.agi - this.skipLoss() >= 1 - 1e-4; }   // 跳过得起吗：跳过要损失agiLoss点敏捷，之后敏捷不能低于1
  consumeAgi() { this.agi = Math.max(1, this.agi - this.skipLoss()); this.skipStreak++; }
  recoverAgi() {
    let rec = this.agiRecover;
    if (this.mods.length) { const adj = this.scaledSum("agi_recover", 0); if (adj !== 0) rec = Math.max(0, rec + adj); }
    this.agi = Math.min(this.getMaxAgi(), this.agi + rec);
  }
  isAlive() { return this.currentHP > 0 && this.currentATK > 0; }
  getAction(a, b) {
    const n = this.defs.length;
    if (typeof a === "string") {
      if (b === undefined) { const d = this.defs.find(x => x.name === a); return d ? singleFromDef(d) : skipAction(); }
      const d1 = this.defs.find(x => x.name === a), d2 = this.defs.find(x => x.name === b);
      if (d1 && d2) { const s1 = singleFromDef(d1), s2 = singleFromDef(d2); if (sameForm(s1, s2)) return dualAction(s1, s2); }
      return skipAction();
    }
    if (b === undefined) {
      // 0..n-1 单招，n..n+2 积攒，n+3 炸弹，其余跳过
      if (a < 0 || a >= n + 4) return skipAction();
      if (a >= n && a <= n + 2) return accumulateAction();
      if (a === n + 3) return bombAction();
      return singleFromDef(this.defs[a]);
    }
    if (a < 0 || a >= n || b < 0 || b >= n) return skipAction();
    const s1 = singleFromDef(this.defs[a]), s2 = singleFromDef(this.defs[b]);
    return sameForm(s1, s2) ? dualAction(s1, s2) : skipAction();
  }
  recoverMP(amount) {
    this.currentMP += amount <= 0 ? this.recover : amount;
    const cap = this.getMaxMP();
    if (this.currentMP > cap * 2) this.currentHP = 0;
    else if (this.currentMP > cap) this.currentMP = cap;
  }
  consumeMP(amount) {
    if (this.currentMP >= amount) this.currentMP -= amount;
    else { const deficit = amount - this.currentMP; this.currentMP = 0; this.currentATK = Math.max(0, this.currentATK - deficit * 2); }
  }
  recoverATK(amount) { this.currentATK = Math.min(this.maxATK, this.currentATK + amount); }
  recoverHP(amount) { this.currentHP = Math.min(this.maxHP, this.currentHP + amount); }
  takeDamage(amount, physical) {
    if (physical) this.currentHP = Math.max(0, this.currentHP - amount);
    else {
      if (amount >= this.currentATK * 0.6) this.currentHP = Math.max(0, this.currentHP - amount);
      else if (amount >= this.currentATK * 0.3) this.currentHP = Math.max(0, Math.trunc(this.currentHP - amount * 0.5));
      this.currentATK -= amount;
    }
  }
  accumulatePower() {
    // 消耗当前真气的一部分，按倍数存进炸弹
    let fraction = ACCUMULATE_FRACTION;
    if (this.mods.length) { const adj = this.scaledSum("acc_ratio", 0); if (adj !== 0) fraction = Math.min(1, Math.max(0, fraction + adj)); }
    const spent = Math.trunc(fraction * this.currentMP);
    this.currentMP -= spent;
    this.bomb += Math.trunc(spent * this.bombMultiplier);
  }
  bombPower() { const p = this.bomb; this.bomb = 0; return p; }
}

/* ---- 日志 ---- */
const logState = (type, player, amount) => ({ type, subject: player, object: -1, attribute: NONE, pointAtk: 0, pointHp: 0, amount, name: "", effect: E_NONE });
const logSkip = player => logState(L_SKIP, player, 0);
const logMove = (subject, object, amount, name, point) => ({ type: L_MOVE, subject, object, attribute: NONE, pointAtk: point, pointHp: 0, amount, name, effect: E_NONE });
const logDamage = (subject, object, attribute, pointAtk, pointHp) => ({ type: L_DAMAGE, subject, object, attribute, pointAtk, pointHp, amount: 0, name: "", effect: E_NONE });
const logDodge = (subject, object) => ({ type: L_DODGE, subject, object, attribute: NONE, pointAtk: 0, pointHp: 0, amount: 0, name: "", effect: E_NONE });
const logEffectDamage = (subject, object, attribute, pointAtk, pointHp, effect) => ({ type: L_EFFECT, subject, object, attribute, pointAtk, pointHp, amount: 0, name: "", effect });
const logEffectAmount = (subject, object, amount, effect) => ({ type: L_EFFECT, subject, object, attribute: NONE, pointAtk: 0, pointHp: 0, amount, name: "", effect });

/* ---- 回合控制器 ---- */
class Controller {
  constructor(cultivators) {
    this.cultivators = cultivators;
    this.effects = cultivators.map(() => []);
    this.environment = [];
    this.status = cultivators.map(() => 0);
    this.regenMP = cultivators.map(() => 0);   // 这回合开始时自然回复的真气量，空炸弹要把它撤销
    this.skipAgi = cultivators.map(() => 0);   // 这回合跳过的人：>0=跳过的闪避用这个敏捷(付不起时是原来的)，0=没跳过
    this.logs = []; this.mark = 0;
    this.critBaseRate = 0; this.critBaseDamage = 0.5;   // 基础暴击率/暴击伤害：PvE对局创建时设置，默认不暴击(PvP的随机数序列不变)
  }
  setCritBase(rate, damage) { this.critBaseRate = rate; this.critBaseDamage = damage; }
  getNews() { const news = this.logs.slice(this.mark); this.mark = this.logs.length; return news; }
  rand() { return Math.random(); }

  startTurn() {
    this.status.fill(0);
    this.skipAgi.fill(0);
    this.execEffect(STAGE_START);
    for (let i = 0; i < this.cultivators.length; i++) { const before = this.cultivators[i].currentMP; this.recoverMP(i, -1); this.regenMP[i] = this.cultivators[i].currentMP - before; this.cultivators[i].recoverAgi(); }
  }

  actionTurn(actions) {
    this.execEffect(STAGE_ACTION);
    // 静止：这回合积攒炸弹，或者没被禁锢却放了空炸弹(跳过不算)；要在所有人出招之前算好，因为放炸弹会清空炸弹存量
    this.staticNow = actions.map((a, j) => a[0].type === A_ACCUMULATE || (a[0].type === A_BOMB && !(this.status[j] & 1) && this.cultivators[j].bomb <= 0));
    for (let i = 0; i < this.cultivators.length; i++) {
      const act = actions[i][0], target = actions[i][1];
      if (act.type === A_SKIP) { this.cultivators[i].resetChain(); this.skipMove(i); this.paySkip(i); }
      else if (act.type === A_ACCUMULATE) {
        this.status[i] |= 2;   // 这一回合在积攒：受到的伤害多ACCUMULATE_VULNERABILITY(见vulnerability)
        this.cultivators[i].resetChain();
        this.makeMove(i, target, act.point, act.text, act.power);
        this.cultivators[i].accumulatePower();
        this.cultivators[i].skipStreak = 0;
      }
      else if (this.status[i] & 1) { this.cultivators[i].resetChain(); this.skipMove(i); this.paySkip(i); }
      else if (act.type === A_BOMB && this.cultivators[i].bomb <= 0) {
        this.cultivators[i].resetChain();
        this.skipMove(i);   // 空炸弹：纯跳过，不翻倍敏捷、不损失敏捷，闪避照常用自己的敏捷；这回合不回复真气
        this.cultivators[i].currentMP = Math.max(0, this.cultivators[i].currentMP - this.regenMP[i]);
      }
      else if (act.type === A_BOMB) {
        this.cultivators[i].resetChain();
        let bombPower = this.cultivators[i].bombPower();   // 战报里写明这次释放的炸弹能量
        if (this.cultivators[i].mods.length) {
          const adj = this.cultivators[i].modSum("bomb_power", NONE);
          if (adj !== 0) bombPower = Math.max(0, Math.trunc(bombPower * (1.0 + adj)));
        }
        this.makeMove(i, target, act.point, act.text + "(能量" + bombPower + ")", act.power);
        act.power = bombPower;
        this.cultivators[i].skipStreak = 0;
      }
      else {
        this.cultivators[i].skipStreak = 0;
        const { chainBonus, critPercent, staticPercent, chainSteps } = this.applyPower(i, target, act);
        let cost = act.point;
        if (this.cultivators[i].mods.length) {
          const adj = this.cultivators[i].modSum("cost", act.attr);
          if (adj !== 0) cost = Math.max(0, Math.trunc(cost * (1.0 + adj)));
        }
        this.makeMove(i, target, cost, act.text, act.power);
        // 连招增伤战报：每个有增伤的基础招式一条(amount=自己的 比例x步数 的百分比，name="招式名|比例%|步数")；双招再加一条合计(name为空)
        for (const st of chainSteps) {
          const lg = logEffectAmount(i, target, Math.round(st.ratio * st.steps * 100), E_INCREASE);
          lg.name = st.name + "|" + parseFloat((st.ratio * 100).toPrecision(4)) + "|" + st.steps;
          this.logs.push(lg);
        }
        if (act.type === A_DUAL && chainBonus > 0) this.logs.push(logEffectAmount(i, target, chainBonus, E_INCREASE));
        if (staticPercent > 0) this.logs.push(logEffectAmount(i, target, staticPercent, E_STATIC));
        if (critPercent > 0) this.logs.push(logEffectAmount(i, target, critPercent, E_CRIT));
        const dot = getEffect(act, E_DOT);
        if (dot && !dot.needHit) {
          const amount = dot.instant;
          this.logs.push(logEffectAmount(i, target, amount, E_DOT));
          this.takeDamage(i, target, act.effects, actions[target][0].effects, act.attr, amount, true, actions[target][0].attr);
          this.addEffect(target, cloneEffect(dot));
        }
        for (const [type, apply, log] of [
          [E_REBATE, a => this.recoverMP(i, a), E_REBATE],
          [E_RECOVER, a => this.recoverATK(i, a), E_RECOVER],
          [E_CURE, a => this.recoverHP(i, a), E_CURE]]) {
          const eff = getEffect(act, type);
          if (eff && !eff.needHit) {
            this.logs.push(logEffectAmount(i, -1, eff.instant, log));
            apply(eff.instant);
            this.addEffect(i, cloneEffect(eff));
          }
        }
        const shield = getEffect(act, E_SHIELD);
        if (shield) {
          const s = cloneEffect(shield);
          s.strength = s.initial = Math.trunc(Math.fround(shield.ratio * this.cultivators[i].maxATK));   // 盾量 = 出招者武力上限 x 比例
          s.mask = this.cultivators[i].elements;   // 盾继承自己的五行属性
          this.logs.push(logEffectAmount(i, -1, s.strength, E_SHIELD));
          this.addEffect(i, s);
        }
      }
    }
    for (const [action] of actions) this.putoutReaction(action.attr);
  }

  checkTurn(actions) {
    this.execEffect(STAGE_CHECK);
    const rust = () => this.findReaction(E_RUST);
    // 被禁锢的一方这回合出的招(除了积攒)已经被跳过，它的减伤/反弹/吸收/物理等效果也不能生效，当作跳过处理
    actions = actions.map((a, j) => ((this.status[j] & 1) && a[0].type !== A_ACCUMULATE) ? [skipAction(), a[1]]
      : (a[0].type === A_BOMB && a[0].power <= 0) ? [skipAction(), a[1]] : a);   // 空炸弹只是纯跳过
    for (let i = 0; i < this.cultivators.length; i++) {
      const actI = actions[i][0], targetI = actions[i][1];
      if (actI.type === A_SKIP || actI.type === A_ACCUMULATE) continue;
      if (this.status[i] & 1) continue;
      const j = targetI;
      const actJ = actions[j][0];
      const ci = this.cultivators[i], cj = this.cultivators[j];
      const notFaced = actJ.type === A_SKIP || actJ.type === A_ACCUMULATE || actions[j][1] !== i || (this.status[j] & 1);

      if (actI.type === A_BOMB) {
        if (notFaced) {
          const powerEnemy = actI.power * (rust() ? BOMB_RUST_FACTOR : BOMB_HIT_FACTOR_PASSIVE);
          const powerSelf = actI.power * (rust() ? BOMB_RUST_FACTOR : BOMB_BACKFIRE_FACTOR);
          this.takeDamage(i, j, actI.effects, actJ.effects, actI.attr, Math.trunc(powerEnemy), true, actJ.attr);
          this.takeDamage(i, i, actI.effects, actI.effects, actI.attr, Math.trunc(powerSelf));
        }
        else if (actJ.type === A_BOMB && actions[j][1] === i) {
          const sum = actI.power + actJ.power;   // 互扔炸弹：两个炸弹之和乘反噬系数，双方一起受到
          const powerEnemy = sum * (rust() ? BOMB_RUST_FACTOR : BOMB_BACKFIRE_FACTOR);
          this.takeDamage(j, j, actJ.effects, actJ.effects, actJ.attr, Math.trunc(powerEnemy));
        }
        else if (actJ.power < actI.power) {
          let powerEnemy = actI.power - actJ.power;
          powerEnemy *= (rust() ? BOMB_RUST_FACTOR : BOMB_HIT_FACTOR_ACTIVE);
          this.takeDamage(i, j, actI.effects, actJ.effects, actI.attr, Math.trunc(powerEnemy), true, actJ.attr);
        }
        continue;
      }

      // 玩家 i 施放普通招式
      if (notFaced) {
        // 对方跳过(含被禁锢而无法出招，但没有选积攒)时：付得起敏捷损失就用翻倍的敏捷闪避(被禁锢的一方也能)，
        // 付不起(闪避之后敏捷会低于1)就无法闪避；没跳过的一方照常用自己的敏捷闪避，被禁锢时不能闪避
        let defAgi = cj.agi, canDodge = true;   // 被禁锢又选了积攒的人也用自己当前的敏捷闪避
        if (this.skipAgi[j] > 0) { defAgi = this.skipAgi[j]; canDodge = true; }
        const dodgeChance = this.dodgeProb(i, j, actI.attr, defAgi);
        if (canDodge && this.rand() < dodgeChance) { this.dodgeSuccess(i, j); this.buildDualEnvironment(actI); continue; }   // 双招被闪避=未命中，计入场地效果
        const hit = this.rollHit(i, actI.attr);
        if (hit) {
          this.hitSuccess(i, j, actI, actJ);
          this.takeDamage(i, j, actI.effects, actJ.effects, actI.attr, actI.power, true, actJ.attr);
        } else { this.hitFail(i); this.buildDualEnvironment(actI); }
      }
      else if (actJ.type === A_BOMB && actions[j][1] === i) {
        // 目标 j 施放真气炸弹且指向 i：只计算 j 受到的伤害
        let powerEnemy = 0;
        if (actI.power < actJ.power) {
          powerEnemy = actJ.power * (rust() ? BOMB_RUST_FACTOR : BOMB_BACKFIRE_FACTOR);
          this.takeDamage(j, j, actJ.effects, actJ.effects, actJ.attr, Math.trunc(powerEnemy));
        }
        else if (actI.power > 2 * actJ.power) {
          powerEnemy = actI.power - 2 * actJ.power;
          this.takeDamage(i, j, actI.effects, actJ.effects, actI.attr, Math.trunc(powerEnemy), true, actJ.attr);
        }
        else {
          powerEnemy = 2 * actJ.power - actI.power;
          powerEnemy *= (rust() ? BOMB_RUST_FACTOR : BOMB_BACKFIRE_FACTOR);
          this.takeDamage(j, j, actJ.effects, actJ.effects, actJ.attr, Math.trunc(powerEnemy));
        }
      }
      else {
        // 双方互相施放普通招式，每对只算一次
        if (j < i) continue;
        let point1 = actI.power, point2 = actJ.power;
        const attr1 = actI.attr, attr2 = actJ.attr;
        if (this.checkCounter(attr1, attr2)) point2 = Math.trunc(point2 / 2);
        if (this.checkCounter(attr2, attr1)) point1 = Math.trunc(point1 / 2);

        // 双方出招的最终属性碰撞产生的场地效果；双招自己的两个基础招式构造的场地效果只在双招未命中时才产生
        const clashReaction = this.addReaction(this.checkReaction(attr1, attr2));

        const hit = this.rollHit(i, attr1);
        if (!hit) {
          this.hitFail(i);
          if (!clashReaction) { this.buildDualEnvironment(actI); this.buildDualEnvironment(actJ); }
          continue;
        }

        // 穿透：额外伤害按较小的那一个威力算(平局时各按对方的)
        const penetrate = (pointForI, pointForJ) => {
          let eff = getEffect(actI, E_PENETRATE);
          if (eff) {
            const pen = Math.trunc(pointForI * ratioOf(eff, attr2));
            this.logs.push(logEffectDamage(i, j, attr1, pen, 0, E_PENETRATE));
            this.takeDamage(i, j, actI.effects, actJ.effects, attr1, pen, false, attr2);
          }
          eff = getEffect(actJ, E_PENETRATE);
          if (eff) {
            const pen = Math.trunc(pointForJ * ratioOf(eff, attr1));
            this.logs.push(logEffectDamage(j, i, attr2, pen, 0, E_PENETRATE));
            this.takeDamage(j, i, actJ.effects, actI.effects, attr2, pen, false, attr1);
          }
        };
        if (point1 > point2) {
          this.hitSuccess(i, j, actI, actJ); this.hitSuccess(j, i, actJ, actI);
          this.takeDamage(i, j, actI.effects, actJ.effects, attr1, point1 - point2, true, attr2);
          penetrate(point2, point2);
        }
        else if (point2 > point1) {
          this.hitSuccess(i, j, actI, actJ); this.hitSuccess(j, i, actJ, actI);
          this.takeDamage(j, i, actJ.effects, actI.effects, attr2, point2 - point1, true, attr1);
          penetrate(point1, point1);
        }
        else {
          this.hitSuccess(i, j, actI, actJ); this.hitSuccess(j, i, actJ, actI);
          penetrate(point2, point1);
        }
      }
    }
  }

  endTurn() {
    this.execEffect(STAGE_END);
    this.environment = this.environment.filter(e => { e.currentRound++; return e.currentRound < e.total; });
    for (const c of this.cultivators) c.tickMods();
  }

  addEffect(idx, effect) { if (idx >= 0 && idx < this.effects.length) this.effects[idx].push(effect); }
  addEnvironment(effect) {
    const k = this.environment.findIndex(e => e.type === effect.type);
    if (k < 0) this.environment.push(effect); else this.environment[k] = effect;
  }

  execEffect(stage) {
    this.execModifiers(stage);
    if (stage === STAGE_END) {
      // 护盾：回合结束时每块盾回合数-1，到期或强度打光就移除
      for (let i = 0; i < this.effects.length; i++) {
        this.effects[i] = this.effects[i].filter(e => {
          if (e.type !== E_SHIELD) return true;
          e.rounds--;
          return !(e.rounds <= 0 || e.strength <= 0);
        });
      }
      return;
    }
    if (stage !== STAGE_START) return; // 其余持续效果都只在回合开始阶段结算
    for (let i = 0; i < this.effects.length; i++) {
      for (let j = 0; j < this.effects[i].length; j++) {
        const eff = this.effects[i][j];
        const erase = () => { this.effects[i].splice(j, 1); j--; };
        if (eff.type === E_LOCK) { this.status[i] |= 1; erase(); }
        else if (eff.type === E_DOT) {
          const dmg = timedOnce(eff);
          if (dmg !== 0) { this.logs.push(logEffectAmount(-1, i, dmg, E_DOT)); this.takeDamage(-1, i, [], [], NONE, dmg, false); const self = this.effects[i].indexOf(eff); if (self >= 0) j = self; }   // 护盾被打光会从effects[i]移除，下标要重新定位
          if (timedUsedUp(eff)) erase();
        }
        else if (eff.type === E_REBATE) {
          const v = timedOnce(eff);
          if (v !== 0) { this.logs.push(logEffectAmount(i, -1, v, E_REBATE)); this.recoverMP(i, v, false); }
          if (timedUsedUp(eff)) erase();
        }
        else if (eff.type === E_RECOVER) {
          const v = timedOnce(eff);
          if (v !== 0) { this.logs.push(logEffectAmount(i, -1, v, E_RECOVER)); this.recoverATK(i, v, false); }
          if (timedUsedUp(eff)) erase();
        }
        else if (eff.type === E_CURE) {
          const v = timedOnce(eff);
          if (v !== 0) { this.logs.push(logEffectAmount(i, -1, v, E_CURE)); this.recoverHP(i, v, false); }
          if (timedUsedUp(eff)) erase();
        }
      }
    }
  }

  recoverMP(idx, amount, log = true) { if (log) this.logs.push(logState(L_MP, idx, amount)); this.cultivators[idx].recoverMP(amount); }
  makeMove(subject, object, amount, name, point) {
    if (this.findReaction(E_MUD)) amount = Math.trunc(amount * 1.5);
    this.logs.push(logMove(subject, object, amount, name, point));
    // 真气不够时先扣光真气，缺的部分按2倍从武力值里透支(consumeMP)，把透支扣掉的武力值写进战报
    const deficit = amount - this.cultivators[subject].currentMP;
    if (deficit > 0) this.logs.push(logState(L_CONSUME, subject, deficit * 2));
    this.cultivators[subject].consumeMP(amount);
  }
  addReaction(r) { if ([E_BURN, E_RUST, E_DUST, E_MUD].includes(r)) { this.addEnvironment(envEffect(r)); return true; } return false; }
  buildDualEnvironment(act) { if (act.type === A_DUAL) this.addReaction(this.checkReaction(act.action1.attr, act.action2.attr)); }
  skipMove(idx) { this.logs.push(logSkip(idx)); }
  recoverATK(idx, amount, log = true) { if (log) this.logs.push(logState(L_ATK, idx, amount)); this.cultivators[idx].recoverATK(amount); }
  recoverHP(idx, amount, log = true) { if (log) this.logs.push(logState(L_HP, idx, amount)); this.cultivators[idx].recoverHP(amount); }
  hitFail(subject) { this.logs.push(logState(L_FAIL, subject, 0)); }
  dodgeSuccess(subject, object) { this.logs.push(logDodge(subject, object)); }

  // 有效威力：本回合出的招(单招=1个，双招=2个基础招式)各自按"家族+式号"查连招链，再乘上特性的各个乘区。
  //   单个基础招式的威力 = (基础威力 + 特性的基础威力加成) x (1 + 增伤比例 x 连续步数)；双招再乘DUAL_POWER_FACTOR；
  //   然后依次乘暴击(1+暴击伤害)、自己的增伤乘区(1+加和)。目标的易伤和减伤是同一个乘区，在takeDamage里结算。同一乘区内加算，乘区之间相乘。
  // 没有任何加成时不动威力(保证没有increase、没有特性的招式和以前逐位一致，也不多抽随机数)。
  applyPower(idx, target, act) {
    const res = { chainBonus: 0, critPercent: 0, staticPercent: 0, chainSteps: [] };   // chainSteps：每个有连招增伤的基础招式各自的{name, ratio, steps}
    const me = this.cultivators[idx];
    const comps = act.type === A_SINGLE ? [act] : act.type === A_DUAL ? [act.action1, act.action2] : null;
    if (!comps) { me.resetChain(); return res; }
    const dual = act.type === A_DUAL;
    const moves = [];
    let chainSum = 0, fullSum = 0, staticSum = 0, boosted = false, added = false;
    const enemyStatic = target >= 0 && target < this.cultivators.length && target !== idx && !!this.staticNow && !!this.staticNow[target];
    for (const s of comps) {
      const family = familyOfName(s.name), form = formOfName(s.name);
      const n = me.peekChain(family, form);
      const inc = getEffect(s, E_INCREASE);
      const ratio = inc ? inc.ratio : 0;
      if (ratio * n > 0) { boosted = true; res.chainSteps.push({ name: s.name, ratio, steps: n }); }
      const base = s.basePower;
      let add = 0;
      for (const m of me.mods) {
        if (m.kind !== "base_power" || !(m.attrMask & (1 << s.attr)) || !me.condHolds(m.cond)) continue;
        add += m.percent ? base * m.value / 100 : m.value;
      }
      if (add !== 0) added = true;
      chainSum += base * (1.0 + ratio * n);
      fullSum += (base + add) * (1.0 + ratio * n);
      // 静止增伤：按这个基础招式在威力里的份量加权(双招时只有带static的那一半贡献)
      if (enemyStatic) { const st = getEffect(s, E_STATIC); if (st) staticSum += st.ratio * (base * (1.0 + ratio * n)); }
      moves.push([family, form]);
    }
    me.commitChain(moves);
    if (boosted) {
      const chainPower = Math.trunc(dual ? DUAL_POWER_FACTOR * chainSum : chainSum);
      res.chainBonus = Math.max(0, Math.round((chainPower / Math.max(1, act.basePower) - 1.0) * 100.0));
    }
    const attr = act.attr;
    let mult = 1.0, zoned = false;
    if (me.hasElement(attr)) { mult *= me.elemPowerMul(attr); zoned = true; }   // 自己拥有的属性的招式：威力倍率(默认1.5)
    // 增伤乘区：特性的增伤加和 + 对静止敌人的增伤(都是加算)
    const staticAdd = chainSum > 0 ? staticSum / chainSum : 0;
    if (staticAdd > 0) res.staticPercent = Math.round(staticAdd * 100);
    {
      let dealt = me.mods.length ? me.modSum("dmg_dealt", attr) : 0;
      dealt += staticAdd;
      if (dealt !== 0) { mult *= Math.max(0, 1.0 + dealt); zoned = true; }
    }
    const rate = this.critBaseRate + (me.mods.length ? me.modSum("crit_rate", attr) : 0);
    if (rate > 0 && this.rand() < rate) {
      const cd = Math.max(0, this.critBaseDamage + (me.mods.length ? me.modSum("crit_dmg", attr) : 0));
      mult *= 1.0 + cd;
      res.critPercent = Math.round(cd * 100.0);
      zoned = true;
    }
    if (!boosted && !added && !zoned) { act.power = act.basePower; return res; }
    const power = (dual ? DUAL_POWER_FACTOR * fullSum : fullSum) * mult;
    act.power = power >= 2147483647 ? 2147483647 : Math.trunc(power);
    return res;
  }

  // 护盾：所有盾一起减去同一个伤害值，穿透量=伤害-最大那块盾的有效容量；强度被打光的盾移除。
  // 盾的五行属性覆盖这次伤害的属性时(同属性)，该盾扣除的量减半(容量翻倍，向上取整)；盾打光后剩下的伤害不再减半。
  applyShield(object, amount, attribute) {
    if (amount <= 0 || object < 0 || object >= this.effects.length) return amount;
    const keeps = e => elementCovers(e.mask || 0, attribute);
    let maxCapacity = 0;
    for (const e of this.effects[object]) if (e.type === E_SHIELD) maxCapacity = Math.max(maxCapacity, keeps(e) ? Math.round(e.strength / ELEM_SHIELD_KEEP) : e.strength);
    if (maxCapacity <= 0) return amount;
    this.effects[object] = this.effects[object].filter(e => {
      if (e.type !== E_SHIELD) return true;
      e.strength = Math.max(0, e.strength - (keeps(e) ? Math.ceil(amount * ELEM_SHIELD_KEEP) : amount));
      return e.strength > 0;
    });
    const absorbed = Math.min(amount, maxCapacity);
    this.logs.push(logEffectAmount(-1, object, absorbed, E_SHIELD));
    return amount - absorbed;
  }
  // 属性抗性乘数：2/(抗性+1)；抗性=100%(默认)时恰为1
  resistFactor(object, attribute) {
    if (object < 0 || object >= this.cultivators.length) return 1.0;
    const x = this.cultivators[object].resist(attribute);
    return x === 1.0 ? 1.0 : 2.0 / (x + 1.0);
  }

  /* ---- 特性 ---- */
  // 特性造成的资源增减(正=回复，负=扣除)，战报里写"资源|来源"
  applyTraitDelta(holder, kind, delta, source) {
    if (delta === 0) return;
    const c = this.cultivators[holder];
    let resource;
    if (["mp_round", "deal_mp", "take_mp", "now_mp"].includes(kind)) { c.adjustMP(delta); resource = "mp"; }
    else if (["atk_round", "deal_atk", "take_atk", "now_atk"].includes(kind)) { c.adjustATK(delta); resource = "atk"; }
    else if (["hp_round", "deal_hp", "take_hp", "now_hp"].includes(kind)) { c.adjustHP(delta); resource = "hp"; }
    else return;
    const lg = logEffectAmount(holder, -1, delta, E_TRAIT);
    lg.name = resource + "|" + source;
    this.logs.push(lg);
  }
  // 每回合类特性：真气/武力/健康的回复或扣除，按timing在回合开始或回合结束执行(武力/健康扣除会致死)
  execModifiers(stage) {
    if (stage !== STAGE_START && stage !== STAGE_END) return;
    const timing = stage === STAGE_START ? 0 : 1;
    for (let i = 0; i < this.cultivators.length; i++) {
      const c = this.cultivators[i];
      if (!c.mods.length) continue;
      for (const m of c.mods.slice()) {
        if (m.timing !== timing) continue;
        if (m.kind !== "mp_round" && m.kind !== "atk_round" && m.kind !== "hp_round") continue;
        if (!c.condHolds(m.cond)) continue;
        const base = m.kind === "mp_round" ? c.getMaxMP() : m.kind === "atk_round" ? c.maxATK : c.maxHP;
        this.applyTraitDelta(i, m.kind, Math.trunc(m.percent ? base * m.value / 100 : m.value), m.source);
      }
    }
  }
  // 触发类特性：造成伤害时(持有者是出手方)、受到伤害时(持有者是受击方)回复或扣除真气/武力/健康
  applyDamageTriggers(subject, object, attribute, damage) {
    if (damage <= 0) return;
    const run = (holder, kinds) => {
      if (holder < 0 || holder >= this.cultivators.length) return;
      const c = this.cultivators[holder];
      if (!c.mods.length) return;
      for (const m of c.mods.slice()) {
        if (!kinds.includes(m.kind)) continue;
        if (!(m.attrMask & (1 << attribute)) || !c.condHolds(m.cond)) continue;
        this.applyTraitDelta(holder, m.kind, Math.trunc(m.percent ? damage * m.value / 100 : m.value), m.source);
      }
    };
    if (subject >= 0 && subject !== object) run(subject, ["deal_mp", "deal_atk", "deal_hp"]);
    run(object, ["take_mp", "take_atk", "take_hp"]);
  }
  // 给持有者加一条特性；立即类(now_*、清除场地、解除禁锢)加的时候马上执行、不保存
  addModifier(holder, m) {
    if (holder < 0 || holder >= this.cultivators.length) return;
    const c = this.cultivators[holder];
    switch (m.kind) {
      case "now_mp": case "now_atk": case "now_hp": {
        const base = m.kind === "now_mp" ? c.getMaxMP() : m.kind === "now_atk" ? c.maxATK : c.maxHP;
        this.applyTraitDelta(holder, m.kind, Math.trunc(m.percent ? base * m.value / 100 : m.value), m.source);
        return;
      }
      case "now_agi": {
        const delta = m.percent ? c.getMaxAgi() * m.value / 100 : m.value;
        c.adjustAgi(delta);
        const lg = logEffectAmount(holder, -1, Math.trunc(delta), E_TRAIT);
        lg.name = "agi|" + m.source;
        this.logs.push(lg);
        return;
      }
      case "now_field": this.addReaction(Math.trunc(m.value)); return;
      case "clear_field": this.environment = []; return;
      case "now_shield": {
        // attr=五行(all)等价于五个属性齐全；none或不写attr=无属性盾；dur=-1不随回合衰减
        let mask = 0;
        if (m.attrMask !== MOD_ATTR_ALL) for (let a = METAL; a <= ALL; a++) if (m.attrMask & (1 << a)) mask |= elementBit(a);
        const strength = Math.trunc(m.value);
        if (strength <= 0) return;
        this.logs.push(logEffectAmount(holder, -1, strength, E_SHIELD));
        this.addEffect(holder, { type: E_SHIELD, strength, initial: strength, rounds: m.duration < 0 ? (1 << 30) : m.duration, mask });
        return;
      }
      case "unlock":
        this.status[holder] &= ~1;
        this.effects[holder] = this.effects[holder].filter(e => e.type !== E_LOCK);
        return;
      default:
        if (m.kind === "dmg_taken" && m.value < 0) return;   // 易伤只增不减，保证受到伤害乘区不会变成0
        c.mods.push(Object.assign({}, m, { cond: Object.assign({}, m.cond) }));
    }
  }
  removeModifiers(holder, source) {
    if (holder < 0 || holder >= this.cultivators.length) return;
    this.cultivators[holder].mods = this.cultivators[holder].mods.filter(m => m.source !== source);
  }
  // 易伤(dmg_taken)特性对attr属性的加和，只增不减(负数不生效)；和减伤同一个受到伤害乘区，在takeDamage里结算
  // 另外这一回合在积攒炸弹的人，固定多一份ACCUMULATE_VULNERABILITY(所有属性、所有伤害来源，包括炸弹和持续伤害)
  vulnerability(object, attr) {
    if (object < 0 || object >= this.cultivators.length) return 0;
    const v = (this.status[object] & 2) ? ACCUMULATE_VULNERABILITY : 0;
    if (!this.cultivators[object].mods.length) return v;
    return v + Math.max(0, this.cultivators[object].modSum("dmg_taken", attr));
  }
  // 闪避率乘区：1 + 特性加和 - 锈蚀(1)；没有特性时锈蚀就是不能闪避
  dodgeProb(attacker, defender, attr, defAgi) {
    const rust = this.findReaction(E_RUST);
    const d = this.cultivators[defender], a = this.cultivators[attacker];
    const base = (defAgi * defAgi) / (a.agi * a.agi + defAgi * defAgi);
    const adj = d.mods.length ? d.modSum("dodge", attr) : 0;
    if (adj === 0) return rust ? 0 : base;
    return Math.min(1, Math.max(0, base * (1.0 + adj - (rust ? 1.0 : 0.0))));
  }
  // 命中率乘区：1 + 特性加和 - 扬尘(0.5)；够1就必中，不抽随机数
  rollHit(attacker, attr) {
    const a = this.cultivators[attacker];
    const zone = 1.0 + (a.mods.length ? a.modSum("hit", attr) : 0) - (this.findReaction(E_DUST) ? 0.5 : 0.0);
    if (zone >= 1.0) return true;
    if (zone <= 0.0) return false;
    return this.rand() < zone;
  }

  // 跳过一次的敏捷损失：付得起(之后不低于1)就记下翻倍后的闪避敏捷，付不起就标记这回合没有闪避
  paySkip(i) {
    const c = this.cultivators[i];
    if (c.canDodge()) { this.skipAgi[i] = c.agi * SKIP_AGI_FACTOR; c.consumeAgi(); }
    else this.skipAgi[i] = c.agi;   // 付不起：不翻倍、不扣敏捷，仍用原来的敏捷闪避
  }

  hitSuccess(subject, object, offend, defend) {
    const lock = getEffect(offend, E_LOCK);
    if (lock) {
      if (this.rand() < lock.prob) { this.logs.push(logEffectAmount(subject, object, 0, E_LOCK)); this.addEffect(object, lock); }
      else lock.keep = false;
    }
    const dot = getEffect(offend, E_DOT);
    if (dot && dot.needHit) {
      this.logs.push(logEffectAmount(subject, object, dot.instant, E_DOT));
      this.takeDamage(subject, object, offend.effects, defend.effects, offend.attr, dot.instant, true, defend.attr);
      this.addEffect(object, cloneEffect(dot));
    }
    for (const [type, apply] of [
      [E_REBATE, a => this.recoverMP(subject, a)], [E_RECOVER, a => this.recoverATK(subject, a)], [E_CURE, a => this.recoverHP(subject, a)]]) {
      const eff = getEffect(offend, type);
      if (eff && eff.needHit) {
        this.logs.push(logEffectAmount(subject, -1, eff.instant, type));
        apply(eff.instant);
        this.addEffect(subject, cloneEffect(eff));
      }
    }
  }

  // 伤害(amount)：先减伤，再按物理比例拆成武力伤害/物理伤害，反弹、吸收
  takeDamage(subject, object, offend, defend, attribute, amount, log = true, defendAttribute = NONE) {
    // 特性：免疫该属性
    if (object >= 0 && object < this.cultivators.length && this.cultivators[object].mods.length && this.cultivators[object].modAny("immune", attribute)) amount = 0;
    // 场地乘区：灼烧是1.5，特性可以按属性以1为基准加减；没有特性时和以前一样
    let fieldAdj = 0;
    if (subject >= 0 && subject < this.cultivators.length && this.cultivators[subject].mods.length) fieldAdj = this.cultivators[subject].modSum("field_mult", attribute);
    if (fieldAdj !== 0) amount = Math.trunc(amount * Math.max(0, (this.findReaction(E_BURN) ? 1.5 : 1.0) + fieldAdj));
    else if (this.findReaction(E_BURN)) amount = Math.trunc(amount * 1.5);
    // 受到伤害乘区：减伤(海龙金身)和易伤是同一个乘区，乘区 = 1 + 易伤加和 - 减伤比例；易伤只增不减，所以乘区至少是 1 - 减伤比例
    const reduce = defend.find(e => e.type === E_REDUCE), vuln = this.vulnerability(object, attribute);
    if (vuln !== 0) amount = Math.trunc(amount * Math.max(0, 1 - (reduce ? ratioOf(reduce, attribute) : 0) + vuln));
    else if (reduce) amount = Math.trunc(amount * (1 - ratioOf(reduce, attribute)));
    { const f = this.resistFactor(object, attribute); if (f !== 1.0) amount = Math.round(amount * f); }   // 属性抗性：伤害x2/(抗性+1)，在护盾之前
    amount = this.applyShield(object, amount, attribute);   // 护盾：同时保护武力和健康，先于物理转换/反弹

    let physicalRatio = 0;
    const physical = offend.find(e => e.type === E_PHYSICAL);
    if (physical) physicalRatio = Math.min(1, Math.max(0, ratioOf(physical, defendAttribute)));
    const hpPart = Math.trunc(amount * physicalRatio);
    const atkPart = amount - hpPart;

    // 反弹是减伤的升级版：受击者只承受反弹之后剩下的伤害，被反弹的那部分全部还给攻击者
    let reboundAtk = 0, reboundHp = 0;
    if (subject >= 0 && subject !== object) {   // subject<0是持续伤害等没有出手方的伤害：不反弹
      let ratio = 0;
      const rebound = defend.find(e => e.type === E_REBOUND);
      if (rebound) ratio = ratioOf(rebound, attribute);
      if (object >= 0 && this.cultivators[object].mods.length) ratio += this.cultivators[object].modSum("rebound", attribute);   // 特性的反弹比例加到反弹效果上
      ratio = Math.min(1, Math.max(0, ratio));
      if (ratio > 0) { reboundAtk = Math.trunc(atkPart * ratio); reboundHp = Math.trunc(hpPart * ratio); }
    }
    const ownAtk = atkPart - reboundAtk, ownHp = hpPart - reboundHp;

    if (log) this.logs.push(logDamage(subject, object, attribute, ownAtk, ownHp));
    if (ownAtk > 0) this.cultivators[object].takeDamage(ownAtk, false);
    if (ownHp > 0) this.cultivators[object].takeDamage(ownHp, true);
    this.applyDamageTriggers(subject, object, attribute, ownAtk + ownHp);

    if (subject === object) return;

    if (reboundAtk > 0 || reboundHp > 0) {
      this.logs.push(logEffectDamage(object, subject, attribute, reboundAtk, reboundHp, E_REBOUND));
      this.takeDamageSplit(object, subject, defend, offend, attribute, reboundAtk, reboundHp, false);
    }
    const absorb = defend.find(e => e.type === E_ABSORB);
    if (absorb) {
      const mp = Math.trunc(amount * ratioOf(absorb, attribute));
      this.logs.push(logEffectAmount(object, subject, mp, E_ABSORB));
      this.recoverMP(object, mp);
    }
  }

  // 伤害(武力值部分atk、物理部分hp)：反弹回来的伤害走这个
  takeDamageSplit(subject, object, offend, defend, attribute, atk, hp, log = true, depth = 0) {
    // 反弹回来的伤害是从已经结算过(含灼烧加成)的伤害按比例算出来的，不再乘一次灼烧；并限制反弹的递归深度
    if (depth >= 8) return;
    const reduce = defend.find(e => e.type === E_REDUCE), vuln = this.vulnerability(object, attribute);   // 同一个受到伤害乘区：1 + 易伤加和 - 减伤比例
    if (vuln !== 0) { const keep = Math.max(0, 1 - (reduce ? ratioOf(reduce, attribute) : 0) + vuln); atk = Math.trunc(atk * keep); hp = Math.trunc(hp * keep); }
    else if (reduce) { const keep = 1 - ratioOf(reduce, attribute); atk = Math.trunc(atk * keep); hp = Math.trunc(hp * keep); }
    { const f = this.resistFactor(object, attribute); if (f !== 1.0) { atk = Math.round(atk * f); hp = Math.round(hp * f); } }
    if (atk + hp > 0) {   // 护盾：穿透量按武力/物理原来的比例分摊
      const total = atk + hp, through = this.applyShield(object, total, attribute);
      if (through !== total) { atk = Math.trunc(atk * (through / total)); hp = through - atk; }
    }

    let reboundAtk = 0, reboundHp = 0;
    if (subject >= 0 && subject !== object) {   // subject<0是持续伤害等没有出手方的伤害：不反弹
      const rebound = defend.find(e => e.type === E_REBOUND);
      if (rebound) {
        const ratio = Math.min(1, Math.max(0, ratioOf(rebound, attribute)));
        reboundAtk = Math.trunc(atk * ratio); reboundHp = Math.trunc(hp * ratio);
      }
    }
    const ownAtk = atk - reboundAtk, ownHp = hp - reboundHp;
    if (log) this.logs.push(logDamage(subject, object, attribute, ownAtk, ownHp));
    if (ownAtk > 0) this.cultivators[object].takeDamage(ownAtk, false);
    if (ownHp > 0) this.cultivators[object].takeDamage(ownHp, true);
    this.applyDamageTriggers(subject, object, attribute, ownAtk + ownHp);   // 反弹回来的伤害也触发特性

    if (subject === object) return;
    if (reboundAtk > 0 || reboundHp > 0) {
      this.logs.push(logEffectDamage(object, subject, attribute, reboundAtk, reboundHp, E_REBOUND));
      this.takeDamageSplit(object, subject, defend, offend, attribute, reboundAtk, reboundHp, false, depth + 1);
    }
    const absorb = defend.find(e => e.type === E_ABSORB);
    if (absorb) {
      const mp = Math.trunc((atk + hp) * ratioOf(absorb, attribute));
      this.logs.push(logEffectAmount(object, subject, mp, E_ABSORB));
      this.recoverMP(object, mp);
    }
  }

  checkCounter(a1, a2) { return COUNTERS.has(a1 + "," + a2); }
  checkReaction(a1, a2) {
    if (a1 === METAL) { if (a2 === FIRE) return E_BURN; if (a2 === WATER) return E_RUST; }
    if (a1 === EARTH) { if (a2 === FIRE) return E_DUST; if (a2 === WATER) return E_MUD; }
    if (a1 === FIRE) { if (a2 === METAL) return E_BURN; if (a2 === EARTH) return E_DUST; }
    if (a1 === WATER) { if (a2 === METAL) return E_RUST; if (a2 === EARTH) return E_MUD; }
    return E_NONE;
  }
  findReaction(type) { return this.environment.some(e => e.type === type); }
  putoutReaction(attribute) {
    const remove = types => { this.environment = this.environment.filter(e => !types.includes(e.type)); };
    if (attribute === METAL) remove([E_DUST, E_MUD]);
    else if (attribute === WATER) remove([E_BURN, E_DUST]);
    else if (attribute === FIRE) remove([E_RUST, E_MUD]);
    else if (attribute === EARTH) remove([E_BURN, E_RUST]);
  }
}

/* ============ 界面与对局流程：布局、文案、颜色照 puzzle_wxdj ============ */
const STANDARD = { hp: 25800, atk: 38900, mp: 24800, recover: 619, agi: 10, bombMultiplier: 10 };   // agi：标准初始敏捷，同时是敏捷上限(满了不跳过也不会再涨)
const $ = id => document.getElementById(id);

const state = {
  elements: [0, 0],   // 双方的五行属性掩码(PvE)，开新局时带过去；联机PvP不用
  defs: [], families: [],        // families: {name, firstAction, formCount}
  player: null, enemy: null, controller: null,
  phase: "select",              // select | result
  mode: "single", firstPick: -1, firstPickFamily: -1, selectedForm: 19, formMax: 20,
  round: 1, result: 0, resultHidden: false,
  cfg: [ { hp: STANDARD.hp, atk: STANDARD.atk, mp: STANDARD.mp, agi: STANDARD.agi, recover: STANDARD.recover, agiLoss: 1, agiRecover: 0.2, bombMultiplier: STANDARD.bombMultiplier },
         { hp: STANDARD.hp, atk: STANDARD.atk, mp: STANDARD.mp, agi: STANDARD.agi, recover: STANDARD.recover, agiLoss: 1, agiRecover: 0.2, bombMultiplier: STANDARD.bombMultiplier } ],
  names: ["玩家", "售货员"],
};

function loadActions(text) {
  const defs = parseActions(text);
  if (!defs.length) return false;
  state.defs = defs;
  state.families = [];
  defs.forEach((d, i) => {
    const pos = d.name.indexOf("第");
    const name = pos < 0 ? d.name : d.name.slice(0, pos);
    const last = state.families[state.families.length - 1];
    if (last && last.name === name) last.formCount++;
    else state.families.push({ name, firstAction: i, formCount: 1 });
  });
  state.formMax = Math.min(...state.families.map(f => f.formCount));
  state.selectedForm = state.formMax - 1;
  return true;
}

function actionIndexOf(family) {
  const f = state.families[family];
  return f.firstAction + Math.min(state.selectedForm, f.formCount - 1);
}

  ["skip_agi", "跳过扣敏捷的调整（加到跳过损失上）"], ["agi_recover", "每回合敏捷回复的调整"], ["agi_max", "敏捷上限增/减（%=按基础上限）"],
  ["mp_max", "真气上限增/减（%=按基础上限）；真气超过2倍上限就爆体，阈值跟着上限走"],

  ["base_power", "x属性基础威力增/减（加算进基础伤害；%=按该招基础威力）"], ["dmg_dealt", "自己造成x属性伤害增/减（增伤乘区，0.2=+20%）"],

  ["rebound", "受到x属性伤害的反弹比例（加到反弹效果上，夹到0~1）"], ["immune", "免疫x属性（伤害变0，数值随便写如1）"],
  ["now_mp now_atk now_hp now_agi", "立即增/减（只在添加时执行一次，没有持续回合）"], ["now_field", "立即添加场地效果：数值11灼烧 12锈蚀 13扬尘 14泥沼"],
  ["clear_field", "立即清除全部场地效果"], ["unlock", "立即解除禁锢"],

  ["elem_power", "自己拥有的属性的招式的威力倍率增/减（基础1.5，增量，最低0，无上限；attr限定招式属性）"],
];
function buildTraitHelp() {
  const rows = MOD_HELP.map(([k, d]) => `<tr><td>${k}</td><td>${d}</td></tr>`).join("");
  $("traitHelp").innerHTML = `格式：<code>mod 种类 数值[%] [attr=…] [cond=…] [dur=…] [timing=…] [src=名字]</code>，<code>#</code>开头是注释。<br>
    <code>attr=</code> 逗号分隔：none metal wood water fire earth all(五行属性的招) elements(金木水火土)，省略=全部；
    <code>cond=hp&lt;50</code> 持有者的 hp/atk/mp/agi 占上限的百分比 低于(&lt;)/高于(&gt;) 阈值才生效；
    <code>dur=</code> 持续回合数，-1=永久（默认）；同种类数值取加和，持续时间各算各的。<table>${rows}</table>`;
}
function parseTraitText(text) {
  const mods = [], errors = [];
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line || line[0] === "#") continue;
    const m = parseModifier(line);
    if (m) mods.push(m); else errors.push(line);
  }
  return { mods, errors };
}
function critFromPanel() {
  const r = parseFloat($("critRate").value), d = parseFloat($("critDmg").value);
  return [Number.isNaN(r) ? 0 : r, Number.isNaN(d) ? 0.5 : d];
}
// 把面板里的特性加到对局里；返回错误行
function addTraitsFromPanel(ctl) {
  const errors = [];
  [["traitMe", 0], ["traitEnemy", 1]].forEach(([id, side]) => {
    const { mods, errors: errs } = parseTraitText($(id).value);
    errors.push(...errs);
    for (const m of mods) ctl.addModifier(side, m);
  });
  return errors;
}
function traitSummary() {
  const c = state.controller;
  if (!c) return "";
  const n0 = state.player.mods.length, n1 = state.enemy.mods.length;
  return n0 || n1 ? "（生效中：我方" + n0 + "条 / 敌方" + n1 + "条）" : "";
}

// 当前"模型"开关选中的AI网络(PvP/PvE)；对应权重没加载时是null
function currentAiNet() { return state.aiNets[$("aiModel").value] || null; }
function makeAgent() { const net = currentAiNet(); return net ? new WxdjAI.Agent(net, 1) : null; }

function newBattle() {
  const [c0, c1] = state.cfg;

function saveCfgFromBattle() {

/* ---- 标准属性：按选定的式所在阶位算(和 ai/transformer 的 gen_pool.stage_stats、battle.md 的"标准初始属性"同一个公式) ----
   同阶位的各式取几何平均的威力/消耗尺度，高阶位健康x0.6^t、武力x0.8^t、真气x1.2^t(t从第3式涨到第12式，最大0.8)。 */
function standardForForm(form) {
  form = Math.max(1, Math.min(20, form));
  const base = state.defs.filter(d => d.name.startsWith("无招"));
  const maxForm = REALM_MAX_FORM[form - 1];
  if (base.length < 20) return Object.assign({ agiLoss: 1, agiRecover: 0.2 }, STANDARD);
  const group = [];
  for (let k = 1; k <= 20; k++) if (REALM_MAX_FORM[k - 1] === maxForm) group.push(k);
  const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  const sp = Math.exp(mean(group.map(k => Math.log(base[k - 1].power / base[0].power))));
  const sc = Math.exp(mean(group.map(k => Math.log(base[k - 1].point / base[0].point))));
  const t = 0.8 * Math.min(1, Math.max(0, (mean(group) - 3) / 9));
  const nice = v => { const step = v < 10000 ? 10 : v < 100000 ? 100 : 1000; return Math.round(v / step) * step; };
  return {
    hp: nice(1000 * sp * Math.pow(0.6, t)), atk: nice(1200 * sp * Math.pow(0.8, t)), mp: nice(800 * sc * Math.pow(1.2, t)),
    recover: Math.max(1, Math.round(20 * sc * Math.pow(1.2, t))),
    agi: 5 + maxForm / 4, agiLoss: 1, agiRecover: 0.2, bombMultiplier: BOMB_MULT_BY_MAXFORM[maxForm],   // 标准敏捷：第1式5.25，每式+0.25，每阶对齐最大式，第20式10
  };
}
// 双方都恢复成当前"AI用第N式"对应阶位的标准属性，重新开战
function applyStandardForSelectedForm() {
  const form = Math.max(1, Math.min(20, parseInt($("aiForm").value) || 20));
  const std = standardForForm(form);
  state.cfg = [Object.assign({}, std), Object.assign({}, std)];
  newBattle();
}

    const info = ENV_INFO[type], old = before.find(b => b[0] === type);

    else if (left > old[1]) pushLogLine("场地刷新：" + info.name + "(还剩" + left + "回合)");
  }

/* ---- 战报 ---- */
function formatLog(log) {
  const who = i => i === 0 ? state.player.name : i === 1 ? state.enemy.name : "";
  const cult = i => i === 0 ? state.player : state.enemy;
  const damageText = kind => {
    let s = "";
    if (log.pointAtk > 0) s += ATTR_TEXT[log.attribute] + log.pointAtk + "点" + kind + "武力伤害";
    if (log.pointAtk > 0 && log.pointHp > 0) s += "和";
    if (log.pointHp > 0 || log.pointAtk <= 0) s += log.pointHp + "点" + kind + "物理伤害";
    return s;
  };
  switch (log.type) {
    case L_MP: return who(log.subject) + "真气量回复至" + cult(log.subject).currentMP;
    case L_ATK: return who(log.subject) + "武力值回复至" + cult(log.subject).currentATK;
    case L_HP: return who(log.subject) + "健康值回复至" + cult(log.subject).currentHP;
    case L_CONSUME: return who(log.subject) + "消耗" + log.amount + "点武力值";
    case L_SKIP: return who(log.subject) + "跳过回合";
    case L_MOVE: return who(log.subject) + "消耗" + log.amount + "点真气对" + who(log.object) + "出招：" + log.name + "，点数" + log.pointAtk;
    case L_DAMAGE: return who(log.subject) + "对" + who(log.object) + "造成" + damageText("招式");
    case L_DODGE: return who(log.object) + "闪避成功";
    case L_FAIL: return who(log.subject) + "出招失败";
    case L_EFFECT:
      switch (log.effect) {
        case E_PENETRATE: return who(log.subject) + "对" + who(log.object) + "造成" + damageText("穿透");
        case E_REBOUND: return who(log.subject) + "对" + who(log.object) + "造成" + damageText("反弹");
        case E_ABSORB: return who(log.subject) + "吸收" + log.amount + "点真气";
        case E_LOCK: return who(log.object) + "被" + who(log.subject) + "禁锢";
        case E_DOT: return who(log.object) + "受到" + log.amount + "点持续武力伤害";
        case E_REBATE: return who(log.subject) + "恢复" + log.amount + "点真气";
        case E_RECOVER: return who(log.subject) + "恢复" + log.amount + "点武力值";
        case E_CURE: return who(log.subject) + "恢复" + log.amount + "点健康值";
        case E_INCREASE: {
          if (!log.name) return who(log.subject) + "双招连招增伤合计：威力+" + log.amount + "%(按两招基础威力加权)";
          const [nm, r, n] = log.name.split("|");
          return who(log.subject) + "连招增伤：" + nm + "每连一步+" + r + "% x 已连" + n + "步 = 威力+" + log.amount + "%";
        }
        case E_STATIC: return who(log.subject) + "的对手处于静止，静止增伤：威力+" + log.amount + "%";
        case E_CRIT: return who(log.subject) + "暴击，伤害+" + log.amount + "%";
        case E_TRAIT: {
          const [res, src] = log.name.split("|");
          const label = { mp: "真气", atk: "武力", hp: "健康", agi: "敏捷" }[res] || res;
          return who(log.subject) + (src ? "的" + src : "的特性") + "：" + label + (log.amount >= 0 ? "+" : "") + log.amount;
        }
        case E_SHIELD: return log.subject >= 0 ? who(log.subject) + "获得" + log.amount + "点护盾" : who(log.object) + "的护盾抵挡了" + log.amount + "点伤害";
      }
  }
  return "";
}
function pushLogLine(text, header = false) {
  if (!text) return;
  const box = $("log");
  const div = document.createElement("div");
  div.textContent = text;
  if (header) div.className = "hdr";
  box.appendChild(div);
  while (box.childElementCount > 2000) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function appendHeader() { pushLogLine("== 第" + state.round + "回合 ==", true); }
function appendNews() { const news = state.controller.getNews(); (state.roundLogs = state.roundLogs || []).push(...news); for (const log of news) pushLogLine(formatLog(log)); }

/* ---- 出招流程(对应 WxdjPuzzle::ResolveTurn) ---- */
function enemyAction() {
  const mode = $("enemyMode").value;
  if (mode === "manual") return manualAction();
  if (mode === "random" || !state.ai) {
    // 纯随机：3/4概率从 ac+6 个选项里挑一个(含积攒/炸弹/跳过)，1/4概率随机双招
    const e = state.enemy, n = state.defs.length, rnd = k => Math.floor(Math.random() * k);
    if (rnd(4)) return e.getAction(rnd(n + 6));
    return e.getAction(rnd(n), rnd(n));
  }
  const form = Math.max(1, Math.min(20, parseInt($("aiForm").value) || 20)) - 1;
  const moves = state.families.map(f => f.firstAction + Math.min(form, f.formCount - 1));
  return state.ai.choose(state.controller, state.round, state.defs, moves, false);
}
function manualAction() {
  const type = $("mType").value, e = state.enemy;
  const a1 = parseInt($("mA1").value), a2 = parseInt($("mA2").value);
  if (type === "skip") return skipAction();
  if (type === "acc") return accumulateAction();
  if (type === "bomb") return bombAction();
  if (type === "single") return e.getAction(a1);
  return e.getAction(a1, a2);
}

function submit(playerAction) {
  if (state.phase !== "select") return;
  if (playerLocked() && playerAction.type !== A_SKIP && playerAction.type !== A_ACCUMULATE) return;
  state.firstPick = -1; state.firstPickFamily = -1;
  state.roundLogs = [];
  if (state.ai) state.ai.beginRound(state.controller);
  const eAct = enemyAction();
  const c = state.controller;
  const acts = [[playerAction, 1], [eAct, 0]];
  c.actionTurn(acts); appendNews();
  c.checkTurn(acts); appendNews();
  c.endTurn(); appendNews();
  logEnvironmentChanges();
  if (state.ai) state.ai.endRound(state.controller, [playerAction, eAct], state.roundLogs);
  checkEnd(true);
  refreshAll();
}
function checkEnd(advance) {
  if (!state.player.isAlive()) { state.result = -1; state.phase = "result"; state.resultHidden = false; }
  else if (!state.enemy.isAlive()) { state.result = 1; state.phase = "result"; state.resultHidden = false; }
  else if (advance) {
    state.round++;
    appendHeader();
    state.controller.startTurn();
    appendNews();
    // 开局恢复真气也可能超过上限2倍而致死
    if (!state.player.isAlive() || !state.enemy.isAlive()) checkEnd(false);
  }
}

/* ---- 招式效果文字(悬停提示) ---- */
const pct = v => parseFloat((v * 100).toPrecision(3)) + "%";
function ratioText(effect) {
  const v = effect.ratios.slice(0, 7);
  const same = (from, to) => { for (let i = from + 1; i <= to; i++) if (Math.abs(v[i] - v[from]) > 1e-6) return false; return true; };
  if (same(0, 6)) return pct(v[0]);
  if (same(0, 5)) return pct(v[0]) + "，对方为五行属性时" + pct(v[6]);
  const labels = ["无", "金", "木", "水", "火", "土", "五行"];
  return "按对方招式属性" + v.map((x, i) => " " + labels[i] + pct(x)).join("");
}
function timedText(label, e) {
  let s = label + "：";
  if (e.needHit) s += "命中后";
  if (e.instant > 0) s += "立即" + e.instant + "点";
  if (e.continuous > 0 && e.rounds > 0) {
    if (e.instant > 0) s += "；";
    s += "每隔" + e.interval + "回合" + e.continuous + "点，共" + e.rounds + "次";
  }
  return s;
}
function effectLines(def) {
  const lines = [];
  for (const e of def.effects) {
    switch (e.type) {
      case E_PHYSICAL: lines.push("物理：" + ratioText(e) + "的伤害转为物理伤害(扣健康值)"); break;
      case E_PENETRATE: lines.push("穿透：对撞时，按较小威力的" + ratioText(e) + "造成额外伤害"); break;
      case E_REDUCE: lines.push("减伤：受到的伤害减少" + ratioText(e)); break;
      case E_REBOUND: lines.push("反弹：将受到伤害的" + ratioText(e) + "反弹给攻击者，自己只承受剩下的(减伤的升级版)"); break;
      case E_ABSORB: lines.push("吸收：将造成伤害的" + ratioText(e) + "转化为真气"); break;
      case E_LOCK: lines.push("禁锢：" + pct(e.prob) + "概率使对手下一回合无法行动"); break;
      case E_DOT: lines.push(timedText("持续伤害", e)); break;
      case E_REBATE: lines.push(timedText("回复真气", e)); break;
      case E_RECOVER: lines.push(timedText("回复武力", e)); break;
      case E_CURE: lines.push(timedText("回复健康", e)); break;
      case E_STATIC: lines.push("静止增伤：对手这回合积攒炸弹或释放空炸弹(没攒过就放)时，本招伤害多" + pct(e.ratio) + "(算在增伤乘区里；对手跳过不算静止)"); break;
      case E_INCREASE: lines.push("连招增伤：连着上一回合同家族的前一式出招(中间不能积攒、放炸弹、跳过或被禁锢)，每连续一步威力多" + pct(e.ratio) + "，不要求命中"); break;
      case E_SHIELD: lines.push("护盾：出招时给自己加一块武力上限" + pct(e.ratio) + "(你现在约" + Math.trunc(Math.fround(e.ratio * state.player.maxATK)) + "点)的护盾，持续" + e.rounds + "回合；同时保护武力和健康，多块盾同时存在，受伤时一起减盾量，盾都被打穿后才扣武力/健康；盾带出招者的五行属性，受到同属性伤害时扣盾量减半(盾打光后剩下的伤害不减半)"); break;
    }
  }
  return lines;
}
function showTip(family, ev) {
  const def = state.defs[actionIndexOf(family)];
  const lines = effectLines(def);
  const tip = $("tip");
  if (!lines.length) { tip.style.display = "none"; return; }
  tip.innerHTML = "";
  const t = document.createElement("div"); t.className = "t"; t.textContent = def.name; tip.appendChild(t);
  for (const l of lines) { const d = document.createElement("div"); d.textContent = l; tip.appendChild(d); }
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 16, y = ev.clientY + 20;
  if (x + w > innerWidth) x = ev.clientX - 16 - w;
  if (y + h > innerHeight) y = ev.clientY - 12 - h;
  tip.style.left = Math.max(0, x) + "px"; tip.style.top = Math.max(0, y) + "px";
}
function hideTip() { $("tip").style.display = "none"; }

/* ---- 手动敌方出招 ---- */
function buildManualSelects() {
  for (const id of ["mA1", "mA2"]) {
    const sel = $(id), keep = sel.value;
    sel.innerHTML = "";
    state.defs.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = d.name + "  " + d.point + "/" + d.power;
      sel.appendChild(o);
    });
    if (keep) sel.value = keep;
  }
  updateManualNote();
}
function updateManualNote() {
  const type = $("mType").value;
  $("mA1").style.display = (type === "single" || type === "dual") ? "" : "none";
  $("mA2").style.display = type === "dual" ? "" : "none";
  let note = "";
  if (type === "dual") {
    const a = state.defs[$("mA1").value], b = state.defs[$("mA2").value];
    if (a && b && !sameForm({ name: a.name }, { name: b.name })) note = "两招不同式，会按“跳过”处理";
  }
  $("mNote").textContent = note;
}

function refreshAll() {
  refreshStatus();
  refreshEnvironment();
  refreshActions();
  const over = $("overlay");
  const showResult = state.phase === "result" && !state.resultHidden;
  over.classList.toggle("show", showResult);
  over.classList.toggle("win", state.result > 0);
  over.classList.toggle("lose", state.result < 0);
  $("overlayText").textContent = state.result > 0 ? "挑战成功" : "挑战失败";
  $("info").textContent = "招式 " + state.defs.length + " · 家族 " + state.families.length;
  $("manual").classList.toggle("show", $("enemyMode").value === "manual");
  $("traitCount").textContent = traitSummary();
}

/* ---- 事件 ---- */
function init() {
  state.aiNets = {};
  if (window.WxdjAI && WxdjAI.ready()) {
    try {
      state.aiNets.pvp = WxdjAI.load();
      const w = window.WXDJ_AI_WEIGHTS_PVP;
      document.title += "（AI：" + w.source + " 第" + w.iter + "轮）";
    } catch (e) { console.error(e); }
  }
  if (window.WxdjAI && WxdjAI.readyPve()) {
    try { state.aiNets.pve = WxdjAI.loadPve(); } catch (e) { console.error(e); }
  }
  for (const opt of $("aiModel").options) {   // 没加载到权重的模型灰掉
    if (!state.aiNets[opt.value]) { opt.disabled = true; opt.title = "没有加载到" + (opt.value === "pve" ? "ai_weights_pve.js(PvE模型还没训练/导出)" : "ai_weights_pvp.js"); }
  }
  if (!state.aiNets.pvp && state.aiNets.pve) $("aiModel").value = "pve";
  if (!Object.keys(state.aiNets).length) {   // 没有权重文件：AI选项去掉，敌方默认纯随机出招
    const opt = $("enemyMode").querySelector('option[value="ai"]');
    if (opt) opt.remove();
    $("enemyMode").value = "random";
    $("aiFormBox").style.display = "none";
    $("aiModelBox").style.display = "none";
  }
  loadActions(BUILTIN_ACTIONS);
  buildStatus(0); buildStatus(1);
  buildList();
  buildManualSelects();
  newBattle();

  $("modeSingle").onclick = () => { state.mode = "single"; state.firstPick = -1; state.firstPickFamily = -1; refreshAll(); };
  $("modeDual").onclick = () => { state.mode = "dual"; state.firstPick = -1; state.firstPickFamily = -1; refreshAll(); };
  $("accBtn").onclick = () => submit(accumulateAction());
  $("bombBtn").onclick = () => submit(bombAction());
  $("skipBtn").onclick = () => submit(skipAction());
  $("form").oninput = ev => { state.selectedForm = parseInt(ev.target.value) - 1; refreshActions(); };
  $("restartBtn").onclick = () => { saveCfgFromBattle(); newBattle(); };
  buildTraitHelp();
  $("critPve").onclick = () => { $("critRate").value = "0.05"; $("critDmg").value = "0.5"; };
  $("traitApply").onclick = () => { saveCfgFromBattle(); newBattle(); };
  $("traitNow").onclick = () => {
    const errs = addTraitsFromPanel(state.controller);
    $("traitMsg").textContent = errs.length ? "无法解析：" + errs.join(" ；") : "已加到当前对局";
    appendNews(); checkEnd(false); refreshAll();
  };
  $("standardBtn").onclick = applyStandardForSelectedForm;
  $("aiForm").onchange = applyStandardForSelectedForm;   // 选了AI用第几式，双方的标准属性跟着变
  $("againBtn").onclick = () => { saveCfgFromBattle(); newBattle(); };
  $("closeBtn").onclick = () => { state.resultHidden = true; refreshAll(); };
  $("enemyMode").onchange = refreshAll;
  $("aiModel").onchange = () => { state.ai = makeAgent(); };   // 换模型：下一回合起用新模型(出招记录重新开始)
  $("mType").onchange = updateManualNote;
  $("mA1").onchange = updateManualNote; $("mA2").onchange = updateManualNote;

  $("actFile").onchange = ev => readFile(ev, text => {
    if (!loadActions(text)) { alert("招式文件解析失败"); return; }
    buildList(); buildManualSelects(); newBattle();
  });
}
function readFile(ev, cb) {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => cb(String(reader.result));
  reader.readAsText(file, "utf-8");
}
init();
</script>
</body>
</html>
