<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>联机对战 本地测试页(不连真实服务器)</title>
<style>
  body { margin: 0; background: #1a1a22; color: #ddd; font: 13px/1.4 "Microsoft YaHei", sans-serif; }
  #bar { padding: 6px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #2a2a36; }
  button { cursor: pointer; padding: 4px 10px; }
  #frames { display: flex; gap: 4px; height: calc(100vh - 150px); }
  iframe { flex: 1; min-width: 0; border: 1px solid #555; background: #12121a; }
  #out { height: 90px; overflow: auto; padding: 4px 10px; font: 12px/1.4 monospace; background: #101016; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar">
  <b>本地测试：用 lobby_core.js 在页面里模拟服务端，两个 iframe 各是一个玩家</b>
  <button id="addBtn">再开一个玩家</button>
  <button id="autoBtn">自动对打一整局(检查两边结果是否一致)</button>
  <button id="soakBtn">连打20局</button>
</div>
<div id="frames"></div>
<div id="out"></div>
<script type="module">
import { onOpen, onMessage, onClose } from '../src/lobby_core.js';

const out = document.getElementById('out');
const say = s => { out.textContent += s + '\n'; out.scrollTop = out.scrollHeight; };

// ---- 用 lobby_core 模拟服务端：每个连接是一个带 att 的假 WebSocket ----
const conns = new Set();
let connSeq = 0;
const traceLog = [];
const trace = s => { traceLog.push((performance.now() | 0) + ' ' + s); if (traceLog.length > 300) traceLog.shift(); };
window.traceLog = traceLog;
const atts = new Map();
const env = {
  all: () => [...conns].filter(c => c.readyState === 1),
  getAtt: c => atts.get(c) || {},
  setAtt: (c, o) => atts.set(c, o),
  send: (c, obj) => { trace('S->' + (c.id) + ' ' + obj.t); setTimeout(() => { if (c.readyState === 1 && c.onmessage) c.onmessage({ data: JSON.stringify(obj) }); }, 0); },
  close: c => closeConn(c),
  rand: Math.random,
};
function closeConn(c) {
  if (c.readyState !== 1) return;
  c.readyState = 3;
  conns.delete(c);
  onClose(env, c);
  setTimeout(() => c.onclose && c.onclose({}), 0);
}
window.WXDJ_CONNECT = function () {
  const c = { id: ++connSeq, readyState: 1, onmessage: null, onclose: null, onerror: null,
    send(str) { trace('C' + c.id + '->S ' + str); setTimeout(() => { if (c.readyState === 1) onMessage(env, c, JSON.parse(str)); }, 0); },
    close() { closeConn(c); } };
  conns.add(c);
  setTimeout(() => onOpen(env, c), 0);      // 等客户端挂好 onmessage 再配对
  return c;
};

// ---- iframe 玩家 ----
const frames = document.getElementById('frames');
const players = [];
function addPlayer() {
  const f = document.createElement('iframe');
  f.src = '../public/index.html';
  frames.appendChild(f);
  players.push(f);
  return f;
}
document.getElementById('addBtn').onclick = () => addPlayer();
addPlayer(); addPlayer();

// ---- 自动对打：双方都随机出招，每回合核对两边状态是否一致 ----
const sleep = ms => new Promise(r => setTimeout(r, ms));
function randomDesc(win) {
  const S = win.wxdjDebug.state, n = S.defs.length;
  const form = Math.floor(Math.random() * S.formMax);
  const pick = () => S.families[Math.floor(Math.random() * S.families.length)];
  const r = Math.random();
  if (r < 0.1) return { t: 'skip' };
  if (r < 0.3) return { t: 'acc' };
  if (r < 0.4) return { t: 'bomb' };
  if (r < 0.75) { const f = pick(); return { t: 'single', i: f.firstAction + Math.min(form, f.formCount - 1) }; }
  const a = pick(), b = pick();
  return { t: 'dual', i: a.firstAction + Math.min(form, a.formCount - 1), j: b.firstAction + Math.min(form, b.formCount - 1) };
}
async function playOneGame(pair, label) {
  const [wa, wb] = pair;
  let mism = 0, rounds = 0;
  for (let guard = 0; guard < 400; guard++) {
    await sleep(15);
    const pa = wa.wxdjDebug.state.phase, pb = wb.wxdjDebug.state.phase;
    if (pa === 'result' && pb === 'result') break;
    if (pa === 'select' && pb === 'select') {
      for (const w of [wa, wb]) {
        w.wxdjDebug.submit(randomDesc(w));
        if (w.wxdjDebug.state.phase === 'select') w.wxdjDebug.submit({ t: 'skip' });   // 被禁锢时随机招式会被拒绝，改成跳过
      }
      await sleep(30);
      rounds++;
      const da = wa.wxdjDebug.digest(), db = wb.wxdjDebug.digest();
      if (da !== db) { mism++; say('✗ ' + label + ' 第' + rounds + '回合 两边状态不一致\n  A:' + da + '\n  B:' + db); }
    }
  }
  const ra = wa.wxdjDebug.state.result, rb = wb.wxdjDebug.state.result;
  const ok = (ra === -rb) && mism === 0;
  say((ok ? '✓ ' : '✗ ') + label + '：' + rounds + '回合，结果 A=' + ra + ' B=' + rb + (mism ? '，不一致 ' + mism + ' 次' : ''));
  return ok;
}
async function waitFor(fn, ms = 3000) { const t = Date.now(); while (Date.now() - t < ms) { if (fn()) return true; await sleep(20); } return false; }

async function autoGames(count) {
  const pair = players.slice(0, 2).map(f => f.contentWindow);
  if (!await waitFor(() => pair.every(w => w.wxdjDebug && w.wxdjDebug.state.phase === 'select'))) { say('两个玩家还没配对成功'); return; }
  let good = 0;
  for (let g = 1; g <= count; g++) {
    if (await playOneGame(pair, '第' + g + '局')) good++;
    if (g < count) {                             // 双方点重新开始
      pair.forEach(w => w.document.getElementById('againBtn').click());
      if (!await waitFor(() => pair.every(w => w.wxdjDebug.state.phase === 'select'))) { say('重新开始后没有进入新局：' + pair.map(w => w.wxdjDebug.state.phase + '/' + w.wxdjDebug.state.result).join(' ') + ' 服务端 ' + JSON.stringify([...conns].map(c => atts.get(c)).map(x => [x.state, x.again, x.act]))); break; }
    }
  }
  say('== 完成：' + good + '/' + count + ' 局两边结果一致 ==');
}
document.getElementById('autoBtn').onclick = () => autoGames(1);
document.getElementById('soakBtn').onclick = () => autoGames(20);
window.autoGames = autoGames;
window.sleep = sleep; window.waitFor = waitFor; window.playersWin = () => players.map(f => f.contentWindow);
window.harnessSay = say;
window.harnessConns = () => ({ n: conns.size, atts: [...conns].map(c => atts.get(c)) });
</script>
</body>
</html>
